<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0F6E56">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="app-icon-192.png">
  <link rel="apple-touch-icon" href="app-icon-192.png">
  <title>Family CFO</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <style>
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f5f5f0;
      --bg-tertiary: #ebebe5;
      --text-primary: #1a1a1a;
      --text-secondary: #6f6e6a;
      --text-tertiary: #9a9a95;
      --border: rgba(0,0,0,0.12);
      --border-strong: rgba(0,0,0,0.25);
      --info-bg: #E6F1FB;
      --info-text: #185FA5;
      --success-bg: #E1F5EE;
      --success-text: #0F6E56;
      --warning-bg: #FAEEDA;
      --warning-text: #BA7517;
      --danger-bg: #FCEBEB;
      --danger-text: #A32D2D;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      font-size: 16px;
      line-height: 1.5;
      overscroll-behavior: none;
    }
    body { min-height: 100vh; min-height: 100dvh; }
    #app {
      max-width: 900px;
      margin: 0 auto;
      padding: 1rem;
      min-height: 100vh;
    }
    button { font-family: inherit; cursor: pointer; }
    input, select { font-family: inherit; }

    /* Login screen */
    #login-screen {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; padding: 2rem;
      background: var(--bg-primary);
    }
    .login-card {
      background: var(--bg-primary);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 2rem;
      max-width: 360px; width: 100%;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .login-card h1 { font-size: 22px; font-weight: 500; margin: 0 0 8px; }
    .login-card p { color: var(--text-secondary); margin: 0 0 1.5rem; font-size: 14px; }
    .login-input {
      width: 100%; padding: 12px; border: 0.5px solid var(--border);
      border-radius: var(--radius-md); font-size: 15px; margin-bottom: 10px;
      background: var(--bg-primary);
    }
    .login-btn {
      width: 100%; padding: 12px; border: none;
      background: #0F6E56; color: white;
      border-radius: var(--radius-md); font-size: 15px; font-weight: 500;
      margin-top: 6px;
    }
    .login-btn:disabled { opacity: 0.5; }
    .login-error { color: var(--danger-text); font-size: 13px; margin-top: 8px; }
    .login-hint { font-size: 12px; color: var(--text-tertiary); margin-top: 1rem; line-height: 1.6; }

    /* Top nav */
    .top-nav {
      display: flex; gap: 8px; align-items: center;
      padding: 4px; background: var(--bg-secondary);
      border-radius: var(--radius-lg); width: fit-content;
      margin-bottom: 1rem;
    }
    .nav-btn {
      border: none; padding: 8px 14px; border-radius: var(--radius-md);
      font-size: 13px; font-weight: 500;
      background: transparent; color: var(--text-secondary);
    }
    .nav-btn.active { background: var(--bg-primary); color: var(--text-primary); }
    .top-nav-right {
      margin-left: auto; display: flex; gap: 8px; align-items: center;
    }
    .icon-btn {
      border: 0.5px solid var(--border); background: var(--bg-primary);
      width: 34px; height: 34px; border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
    }

    /* Kid picker */
    /* Family dashboard on picker */
    .family-dashboard {
      background: var(--bg-primary);
      border-radius: var(--radius-xl);
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
      border: 0.5px solid var(--border);
    }

    .picker {
      background: var(--bg-secondary);
      border-radius: var(--radius-xl); padding: 2.5rem 2rem;
      min-height: 360px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .picker-title { font-size: 18px; font-weight: 500; margin: 0 0 1.75rem; }
    .picker-grid { display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center; }
    .kid-tile {
      border: none; border-radius: var(--radius-xl);
      padding: 1.5rem 2rem;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      min-width: 180px;
      transition: transform 0.15s;
    }
    .kid-tile:active { transform: scale(0.97); }
    .kid-avatar {
      width: 84px; height: 84px; border-radius: 50%;
      color: white;
      display: flex; align-items: center; justify-content: center;
      font-size: 38px; font-weight: 500;
    }

    /* Kid view */
    .kid-header {
      border-radius: var(--radius-xl); padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .kid-header-left { display: flex; align-items: center; gap: 12px; }
    .kid-header-avatar {
      width: 48px; height: 48px; border-radius: 50%;
      color: white; display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 500;
    }
    .back-btn {
      border: 0.5px solid currentColor; background: transparent;
      padding: 6px 12px; border-radius: var(--radius-md); font-size: 13px;
    }

    /* Jars */
    .jars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .jar {
      border-radius: var(--radius-xl); padding: 0.875rem; text-align: center;
    }
    .jar-glass {
      position: relative;
      margin: 0 auto 8px;
      border-style: solid; border-top: none;
      border-radius: 0 0 10px 10px;
      overflow: hidden; background: white;
    }
    .jar-fill {
      position: absolute; bottom: 0; left: 0; right: 0;
      opacity: 0.7; transition: height 0.6s ease;
    }
    .jar-icon {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
    }

    /* Chore grid */
    .chore-grid {
      background: var(--bg-primary);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-xl);
      overflow: hidden; margin-top: 12px;
    }
    /* Make day-column area horizontally scrollable on narrow viewports */
    .grid-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x proximity;
    }
    .grid-scroll::-webkit-scrollbar { height: 4px; }
    .grid-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .grid-header {
      display: grid; grid-template-columns: 1fr repeat(7, 36px); gap: 0;
      padding: 10px 12px 6px;
      border-bottom: 0.5px solid var(--border);
      background: var(--bg-secondary);
      min-width: max-content;
    }
    .grid-header-day {
      text-align: center; font-size: 11px; font-weight: 500;
      color: var(--text-secondary); text-transform: uppercase;
      scroll-snap-align: center;
    }
    .grid-header-day.today { color: var(--info-text); }
    .grid-header-day.today::after {
      content: ''; display: block; width: 4px; height: 4px;
      background: var(--info-text); border-radius: 50%;
      margin: 2px auto 0;
    }
    .chore-row {
      display: grid; grid-template-columns: 1fr repeat(7, 36px); gap: 0;
      padding: 12px; align-items: center;
      border-bottom: 0.5px solid var(--border);
      min-width: max-content;
    }
    .chore-row:last-child { border-bottom: none; }
    .chore-info {
      display: flex; align-items: center; gap: 10px;
      min-width: 200px; max-width: 240px;
      padding-right: 8px;
    }
    .chore-icon-circle {
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .chore-title {
      font-weight: 500; margin: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .chore-meta { display: flex; align-items: center; gap: 8px; margin-top: 2px; }

    /* Day cells */
    .day-cell {
      width: 28px; height: 28px; margin: 0 auto;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s ease;
    }
    .day-cell.today { box-shadow: 0 0 0 2px var(--info-text); }
    .day-cell.tickable { cursor: pointer; }
    .day-cell.tickable:active { transform: scale(0.92); }

    /* Tap-size variants: scale ENTIRE chore row, not just the day cell */
    /* Big */
    .chore-grid.tap-big .grid-header,
    .chore-grid.tap-big .chore-row {
      grid-template-columns: 1fr repeat(7, 48px);
    }
    .chore-grid.tap-big .chore-row { padding: 14px 10px; }
    .chore-grid.tap-big .chore-icon-circle { width: 44px !important; height: 44px !important; }
    .chore-grid.tap-big .chore-icon-circle .ti { font-size: 22px !important; }
    .chore-grid.tap-big .chore-title { font-size: 15px !important; }
    .chore-grid.tap-big .day-cell { width: 40px; height: 40px; border-radius: 8px; }
    .chore-grid.tap-big .day-cell .ti { font-size: 20px !important; }
    .chore-grid.tap-big .day-cell span { font-size: 22px !important; }
    .chore-grid.tap-big .grid-header-day { font-size: 13px; }

    /* Extra big */
    .chore-grid.tap-extra-big .grid-header,
    .chore-grid.tap-extra-big .chore-row {
      grid-template-columns: 1fr repeat(7, 60px);
    }
    .chore-grid.tap-extra-big .chore-row { padding: 18px 12px; }
    .chore-grid.tap-extra-big .chore-icon-circle { width: 56px !important; height: 56px !important; }
    .chore-grid.tap-extra-big .chore-icon-circle .ti { font-size: 28px !important; }
    .chore-grid.tap-extra-big .chore-title { font-size: 17px !important; }
    .chore-grid.tap-extra-big .day-cell { width: 52px; height: 52px; border-radius: 10px; }
    .chore-grid.tap-extra-big .day-cell .ti { font-size: 26px !important; }
    .chore-grid.tap-extra-big .day-cell span { font-size: 28px !important; }
    .chore-grid.tap-extra-big .grid-header-day { font-size: 14px; }

    /* Huge */
    .chore-grid.tap-huge .grid-header,
    .chore-grid.tap-huge .chore-row {
      grid-template-columns: 1fr repeat(7, 76px);
    }
    .chore-grid.tap-huge .chore-row { padding: 22px 14px; }
    .chore-grid.tap-huge .chore-icon-circle { width: 68px !important; height: 68px !important; }
    .chore-grid.tap-huge .chore-icon-circle .ti { font-size: 36px !important; }
    .chore-grid.tap-huge .chore-title { font-size: 19px !important; }
    .chore-grid.tap-huge .day-cell { width: 68px; height: 68px; border-radius: 12px; }
    .chore-grid.tap-huge .day-cell .ti { font-size: 34px !important; }
    .chore-grid.tap-huge .day-cell span { font-size: 36px !important; }
    .chore-grid.tap-huge .grid-header-day { font-size: 16px; }

    /* Cards */
    .card {
      background: var(--bg-primary);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
    }
    .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    @media (min-width: 600px) { .stat-grid { grid-template-columns: repeat(4, 1fr); } }
    .stat-card { border-radius: var(--radius-md); padding: 0.875rem; }
    .stat-label {
      font-size: 11px; margin: 0;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .stat-value { font-size: 22px; font-weight: 500; margin: 4px 0 0; }

    /* Burst animation */
    @keyframes burst {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
    }
    .burst { animation: burst 0.6s ease forwards; pointer-events: none; }

    /* Approval rows */
    .approval-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 0;
      border-bottom: 0.5px solid var(--border);
    }
    .approval-row:last-child { border-bottom: none; }
    .approval-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      color: white;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 500; flex-shrink: 0;
    }
    .approve-btn {
      border: none; background: var(--success-bg); color: var(--success-text);
      padding: 6px 12px; border-radius: var(--radius-md);
      font-size: 12px; font-weight: 500;
    }
    .reject-btn {
      border: 0.5px solid var(--border); background: transparent;
      color: var(--text-secondary);
      padding: 6px 12px; border-radius: var(--radius-md); font-size: 12px;
    }

    /* Manager note */
    .manager-note {
      background: var(--info-bg);
      border-radius: var(--radius-xl);
      padding: 1rem 1.25rem;
      display: flex; gap: 12px; align-items: flex-start;
      color: var(--info-text);
    }

    /* Loading */
    #loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-primary); z-index: 9999;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: #0F6E56;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Connection status */
    .conn-status {
      position: fixed; top: 8px; right: 8px;
      padding: 4px 10px; border-radius: var(--radius-md);
      font-size: 11px; z-index: 100;
      display: none;
    }
    .conn-status.offline {
      display: block;
      background: var(--warning-bg); color: var(--warning-text);
    }

    /* Add chore form */
    .form-row {
      display: flex; flex-direction: column; gap: 6px;
      margin-bottom: 12px;
    }
    .form-row label { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
    .form-row input, .form-row select {
      padding: 10px; border: 0.5px solid var(--border);
      border-radius: var(--radius-md); font-size: 14px;
      background: var(--bg-primary);
    }
    .day-toggles { display: flex; gap: 4px; flex-wrap: wrap; }
    .day-toggle {
      width: 36px; height: 36px; border: 0.5px solid var(--border);
      background: var(--bg-primary); border-radius: var(--radius-md);
      font-size: 12px; font-weight: 500;
    }
    .day-toggle.active { background: #0F6E56; color: white; border-color: #0F6E56; }

    /* Chore management */
    .chore-mgmt-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 0;
      border-bottom: 0.5px solid var(--border);
    }
    .chore-mgmt-row:last-child { border-bottom: none; }
    .chore-mgmt-row .reorder-btns {
      display: flex; flex-direction: column; gap: 2px;
    }
    .chore-mgmt-row .reorder-btn {
      width: 24px; height: 18px; border: 0.5px solid var(--border);
      background: var(--bg-primary); border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      padding: 0; color: var(--text-secondary);
    }
    .chore-mgmt-row .reorder-btn:disabled { opacity: 0.3; }
    .chore-mgmt-row .edit-chore-btn {
      border: none; background: transparent; color: var(--info-text);
      padding: 4px;
    }

    /* Kid avatar with photo */
    .kid-avatar.has-photo, .kid-header-avatar.has-photo, .approval-avatar.has-photo {
      background-size: cover; background-position: center; color: transparent;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; padding: 1rem;
    }
    .modal {
      background: var(--bg-primary); border-radius: var(--radius-xl);
      width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto;
      padding: 1.25rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .modal h2 { font-size: 16px; font-weight: 500; margin: 0 0 1rem; }
    .modal-actions {
      display: flex; gap: 8px; margin-top: 1rem;
    }
    .modal-actions .save {
      flex: 1; background: #0F6E56; color: white; border: none;
      padding: 12px; border-radius: var(--radius-md);
      font-size: 14px; font-weight: 500;
    }
    .modal-actions .cancel {
      border: 0.5px solid var(--border); background: var(--bg-primary);
      padding: 12px 16px; border-radius: var(--radius-md);
      font-size: 14px;
    }

    /* Icon picker */
    .icon-picker {
      display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px;
      max-height: 220px; overflow-y: auto;
      padding: 8px; background: var(--bg-secondary);
      border-radius: var(--radius-md);
    }
    .icon-pick-btn {
      width: 100%; aspect-ratio: 1; border: 0.5px solid var(--border);
      background: var(--bg-primary); border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      padding: 0;
    }
    .icon-pick-btn.selected {
      background: #0F6E56; color: white; border-color: #0F6E56;
    }

    /* Photo upload */
    .photo-upload-wrap {
      display: flex; align-items: center; gap: 12px;
    }
    .photo-preview {
      width: 60px; height: 60px; border-radius: 50%;
      background: var(--bg-tertiary);
      background-size: cover; background-position: center;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-secondary); font-size: 22px; font-weight: 500;
      flex-shrink: 0;
    }
    .photo-upload-wrap input[type="file"] { display: none; }
    .photo-upload-btn {
      border: 0.5px solid var(--border); background: var(--bg-primary);
      padding: 8px 14px; border-radius: var(--radius-md); font-size: 13px;
    }
    .photo-upload-btn.removing { color: var(--danger-text); }

    /* Mode toggle */
    .mode-toggle {
      display: flex; gap: 4px;
    }
    .mode-toggle-btn {
      flex: 1; padding: 8px;
      border: 0.5px solid var(--border); background: var(--bg-primary);
      border-radius: var(--radius-md); font-size: 12px; font-weight: 500;
      color: var(--text-primary);
    }
    .mode-toggle-btn.active {
      background: #0F6E56; color: white; border-color: #0F6E56;
    }

    /* Action prompts (Save transfer, Give quarterly) */
    .action-prompt {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 0;
      border-bottom: 0.5px solid var(--border);
    }
    .action-prompt:last-child { border-bottom: none; }

    /* Value pills (kid view) — display only */
    .value-pill {
      transition: transform 0.15s;
    }

    /* Bonus celebration animations */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.5); }
      60% { opacity: 1; transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      30% { transform: translateY(-15px); }
      60% { transform: translateY(0); }
    }
    .celebrate-modal {
      box-shadow: 0 12px 48px rgba(0,0,0,0.3);
    }

    /* Flag toggle (schoolReady / hardWork / bonus values) */
    .flag-toggle {
      display: flex; gap: 6px; flex-wrap: wrap;
    }
    .flag-toggle button, .bonus-value-btn {
      padding: 6px 12px; border: 0.5px solid var(--border);
      background: var(--bg-primary); border-radius: var(--radius-md);
      font-size: 12px;
    }
    .flag-toggle button.active, .bonus-value-btn.active {
      background: var(--bg-tertiary); border-color: var(--text-primary);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div id="loading"><div class="spinner"></div></div>
  <div class="conn-status" id="conn-status">Offline · changes saved locally</div>
  <div id="login-screen" style="display: none;">
    <div class="login-card">
      <h1>Family CFO</h1>
      <p>Sign in to continue</p>
      <input class="login-input" type="email" id="email" placeholder="Email" autocomplete="email">
      <input class="login-input" type="password" id="password" placeholder="Password" autocomplete="current-password">
      <button class="login-btn" id="signin-btn">Sign in</button>
      <div class="login-error" id="login-error"></div>
      <div class="login-hint">First time? Create accounts in Firebase Console → Authentication → Users.</div>
    </div>
  </div>
  <div id="app" style="display: none;"></div>
  <div id="modal-root"></div>
  <div id="version-footer" style="text-align:center;font-size:10px;color:rgba(0,0,0,0.3);padding:8px;cursor:pointer;user-select:none;display:none">Family CFO · v8</div>

  <!-- Firebase v10 (modular) via CDN -->
  <script type="module">
    // Imports
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, setDoc, onSnapshot, enableIndexedDbPersistence,
      collection, addDoc, deleteDoc, updateDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import {
      getStorage, ref as storageRef, uploadBytes, getDownloadURL, deleteObject
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

    // Pull config from sibling file

    // ---------- Photo helpers (resize before upload) ----------
    async function resizeImage(file, max = 256) {
      const dataUrl = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = rej;
        r.readAsDataURL(file);
      });
      const img = await new Promise((res, rej) => {
        const i = new Image();
        i.onload = () => res(i);
        i.onerror = rej;
        i.src = dataUrl;
      });
      // Square crop centered
      const side = Math.min(img.width, img.height);
      const sx = (img.width - side) / 2;
      const sy = (img.height - side) / 2;
      const canvas = document.createElement('canvas');
      canvas.width = max; canvas.height = max;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, sx, sy, side, side, 0, 0, max, max);
      return new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.85));
    }

        reader.readAsDataURL(file);
      });
    }

    function showCropUI(img, resolve) {
      const SIZE = 260;
      // Inject crop modal as overlay (don't replace existing modal-root content)
      const overlayDiv = document.createElement('div');
      overlayDiv.id = 'crop-overlay';
      overlayDiv.innerHTML = `
        <div class="modal-backdrop" id="crop-backdrop" style="z-index:1100">
          <div class="modal" style="max-width:340px;text-align:center">
            <h2>Position photo</h2>
            <p style="font-size:12px;color:var(--text-secondary);margin:0 0 12px">Drag to move. Use the slider to zoom. The circle is what will be saved.</p>
            <div id="crop-stage" style="position:relative;width:${SIZE}px;height:${SIZE}px;margin:0 auto;background:#000;border-radius:8px;overflow:hidden;cursor:grab;touch-action:none">
              <img id="crop-img" src="${img.src}" style="position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;pointer-events:none" draggable="false">
              <div style="position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 9999px rgba(0,0,0,0.5);pointer-events:none"></div>
              <div style="position:absolute;inset:0;border-radius:50%;border:2px dashed rgba(255,255,255,0.6);pointer-events:none"></div>
            </div>
            <div style="margin-top:12px;display:flex;align-items:center;gap:8px">
              <i class="ti ti-zoom-out" style="font-size:18px;color:var(--text-secondary)"></i>
              <input type="range" id="crop-zoom" min="100" max="400" value="100" style="flex:1">
              <i class="ti ti-zoom-in" style="font-size:18px;color:var(--text-secondary)"></i>
            </div>
            <div class="modal-actions">
              <button class="cancel" id="crop-cancel">Cancel</button>
              <button class="save" id="crop-save">Use this</button>
            </div>
          </div>
        </div>
      `;
      $('modal-root').appendChild(overlayDiv);

      const removeOverlay = () => {
        const o = $('crop-overlay');
        if (o) o.remove();
      };

      const stage = $('crop-stage');
      const imgEl = $('crop-img');

      const baseScale = SIZE / Math.min(img.width, img.height);
      let scale = baseScale;
      let userZoom = 1;
      let offsetX = (SIZE - img.width * scale) / 2;
      let offsetY = (SIZE - img.height * scale) / 2;

      function applyTransform() {
        const finalScale = scale * userZoom;
        const minX = SIZE - img.width * finalScale;
        const minY = SIZE - img.height * finalScale;
        if (offsetX > 0) offsetX = 0;
        if (offsetY > 0) offsetY = 0;
        if (offsetX < minX) offsetX = minX;
        if (offsetY < minY) offsetY = minY;
        imgEl.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${finalScale})`;
      }
      applyTransform();

      let dragging = false, dx = 0, dy = 0;
      const start = (x, y) => { dragging = true; dx = x - offsetX; dy = y - offsetY; stage.style.cursor = 'grabbing'; };
      const move = (x, y) => { if (!dragging) return; offsetX = x - dx; offsetY = y - dy; applyTransform(); };
      const end = () => { dragging = false; stage.style.cursor = 'grab'; };

      const mouseMove = e => move(e.clientX, e.clientY);
      const mouseUp = () => end();
      stage.addEventListener('mousedown', e => start(e.clientX, e.clientY));
      window.addEventListener('mousemove', mouseMove);
      window.addEventListener('mouseup', mouseUp);
      stage.addEventListener('touchstart', e => { const t = e.touches[0]; start(t.clientX, t.clientY); }, { passive: true });
      stage.addEventListener('touchmove', e => { const t = e.touches[0]; move(t.clientX, t.clientY); e.preventDefault(); }, { passive: false });
      stage.addEventListener('touchend', end);

      const zoomInput = $('crop-zoom');
      zoomInput.oninput = (e) => {
        const newZoom = parseInt(e.target.value) / 100;
        const cx = SIZE / 2, cy = SIZE / 2;
        const px = (cx - offsetX) / (scale * userZoom);
        const py = (cy - offsetY) / (scale * userZoom);
        userZoom = newZoom;
        offsetX = cx - px * scale * userZoom;
        offsetY = cy - py * scale * userZoom;
        applyTransform();
      };

      const cleanup = () => {
        window.removeEventListener('mousemove', mouseMove);
        window.removeEventListener('mouseup', mouseUp);
        removeOverlay();
      };

      $('crop-cancel').onclick = () => { cleanup(); resolve(null); };
      $('crop-backdrop').onclick = (e) => { if (e.target.id === 'crop-backdrop') { cleanup(); resolve(null); } };

      $('crop-save').onclick = () => {
        const OUT = 256;
        const canvas = document.createElement('canvas');
        canvas.width = OUT; canvas.height = OUT;
        const ctx = canvas.getContext('2d');
        const finalScale = scale * userZoom;
        const sx = -offsetX / finalScale;
        const sy = -offsetY / finalScale;
        const sSize = SIZE / finalScale;
        ctx.drawImage(img, sx, sy, sSize, sSize, 0, 0, OUT, OUT);
        canvas.toBlob((blob) => {
          cleanup();
          resolve(blob);
        }, 'image/jpeg', 0.88);
      };
    }

    function ensureAudio() {
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch (e) { return null; }
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playMarioCoin() {
      const ctx = ensureAudio(); if (!ctx || !soundOn) return;
      const t0 = ctx.currentTime;
      const master = ctx.createGain();
      master.gain.value = 0.16;
      master.connect(ctx.destination);
      const o1 = ctx.createOscillator();
      const g1 = ctx.createGain();
      o1.type = 'square';
      o1.frequency.setValueAtTime(987.77, t0);
      g1.gain.setValueAtTime(0, t0);
      g1.gain.linearRampToValueAtTime(1, t0 + 0.005);
      g1.gain.setValueAtTime(1, t0 + 0.085);
      g1.gain.linearRampToValueAtTime(0, t0 + 0.095);
      o1.connect(g1); g1.connect(master);
      o1.start(t0); o1.stop(t0 + 0.1);
      const o2 = ctx.createOscillator();
      const g2 = ctx.createGain();
      o2.type = 'square';
      o2.frequency.setValueAtTime(1318.51, t0 + 0.095);
      g2.gain.setValueAtTime(0, t0 + 0.095);
      g2.gain.linearRampToValueAtTime(1, t0 + 0.1);
      g2.gain.setValueAtTime(1, t0 + 0.36);
      g2.gain.exponentialRampToValueAtTime(0.001, t0 + 0.46);
      o2.connect(g2); g2.connect(master);
      o2.start(t0 + 0.095); o2.stop(t0 + 0.48);
    }

    function playApprovalChime() {
      const ctx = ensureAudio(); if (!ctx || !soundOn) return;
      [[1568,0,0.08],[2093,0.06,0.08],[2637,0.12,0.18]].forEach(([f,w,d]) => {
        const t0 = ctx.currentTime + w;
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(f, t0);
        g.gain.setValueAtTime(0, t0);
        g.gain.linearRampToValueAtTime(0.16, t0 + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
        osc.connect(g); g.connect(ctx.destination);
        osc.start(t0); osc.stop(t0 + d + 0.05);
      });
    }

    // Bigger, celebratory sound for bonus awards
    function playBonusFanfare() {
      const ctx = ensureAudio(); if (!ctx || !soundOn) return;
      // Ascending arpeggio: C5, E5, G5, C6, E6 — feels triumphant
      const notes = [[523, 0, 0.12], [659, 0.10, 0.12], [784, 0.20, 0.12], [1047, 0.30, 0.18], [1319, 0.42, 0.30]];
      notes.forEach(([f, w, d]) => {
        const t0 = ctx.currentTime + w;
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(f, t0);
        g.gain.setValueAtTime(0, t0);
        g.gain.linearRampToValueAtTime(0.18, t0 + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
        osc.connect(g); g.connect(ctx.destination);
        osc.start(t0); osc.stop(t0 + d + 0.05);
      });
    }

    async function loadState(user) {
      const ref = familyDocRef();

        await setDoc(ref, {

          createdAt: serverTimestamp(),

      } else {
        const data = snap.data();
        // Strip Firestore-only fields
        delete data.createdAt; delete data.createdBy; delete data.updatedAt; delete data.updatedBy;
        state = data;
        // Ensure structure (in case schema evolves)
        if (!state.kids) state.kids = DEFAULT_STATE.kids;
        if (!state.pendingApprovals) state.pendingApprovals = [];
        migrateToV3();
      }
      maybeWeeklyReset();
    }

    function migrateToV3() {
      // Add paid, category, history arrays, goal, bonusHistory — for any docs created before Batch 2/3
      Object.values(state.kids).forEach(kid => {
        if (!kid.spendHistory) kid.spendHistory = [];
        if (!kid.saveHistory) kid.saveHistory = [];
        if (!kid.giveHistory) kid.giveHistory = [];
        if (!kid.bonusHistory) kid.bonusHistory = [];
        if (!kid.goal) kid.goal = { enabled: false, name: '', target: 0, matchRatio: 1 };
        if (!kid.tapSize) kid.tapSize = (kid.mode === 'pre-reader' ? 'big' : 'standard');
        // Migrate pre-reader → learning (TTS removed)
        if (kid.mode === 'pre-reader') kid.mode = 'learning';
        (kid.chores || []).forEach(c => {
          if (c.paid === undefined) c.paid = (c.amount > 0);
          if (!c.category) c.category = c.paid ? 'extras' : 'routines';
          if (!c.paid) c.amount = 0;
        });
      });
      if (!state.lastGiveQuarter) state.lastGiveQuarter = null;
      // Migrate familyValues from string[] to {name, emoji}[]
      if (!state.familyValues) {
        state.familyValues = [
          { name: 'Courage', emoji: '🦁' },
          { name: 'Curiosity', emoji: '🔍' },
          { name: 'Honesty', emoji: '🤝' },
          { name: 'Kindness', emoji: '❤️' },
          { name: 'Resilience', emoji: '💪' },
        ];
      } else if (state.familyValues.length > 0 && typeof state.familyValues[0] === 'string') {
        // Old format: array of strings → upgrade to objects with auto-suggested emoji
        state.familyValues = state.familyValues.map(name => ({
          name,
          emoji: suggestEmoji(name)
        }));
      }
      if (!state.familyMottos) {
        state.familyMottos = [
          'Work hard, play hard',
          'Try, fail, try again',
          'We help each other',
        ];
      }
    }

    function maybeWeeklyReset() {
      // If we've crossed into a new ISO week since last reset, clear history
      const now = new Date();
      const year = now.getFullYear();
      const onejan = new Date(year, 0, 1);
      const week = Math.ceil((((now - onejan) / 86400000) + onejan.getDay() + 1) / 7);
      const weekKey = `${year}-W${week}`;
      if (state.lastResetWeek !== weekKey) {
        // Reset history but preserve streaks if they were maintained
        Object.values(state.kids).forEach(kid => {
          kid.chores.forEach(chore => {
            const lastWeekFullyDone = chore.history.every((h, i) =>
              !chore.schedule[i] || h === 'done' || h === 'na'
            );
            chore.history = chore.schedule.map(s => s ? 'available' : 'na');
            // Streak persists if last week was fully done; otherwise reset
            if (!lastWeekFullyDone) chore.streak = 0;
          });
        });
        state.lastResetWeek = weekKey;
        scheduleSave();
      }
    }

    // Listen for remote changes
    function startListening() {
      if (unsubscribe) unsubscribe();
      unsubscribe = onSnapshot(familyDocRef(), (snap) => {
        if (!snap.exists()) return;
        // Don't override if save in flight
        if (saveTimer) return;
        const data = snap.data();
        delete data.createdAt; delete data.createdBy; delete data.updatedAt; delete data.updatedBy;
        // Only update if different
        if (JSON.stringify(data) !== JSON.stringify(state)) {
          state = data;
          if (!state.pendingApprovals) state.pendingApprovals = [];
          migrateToV3();
          render();
        }
      }, (err) => {
        console.warn('Listener error:', err);
      });
    }

    function scheduleSave() {
      if (saveTimer) clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        try {
          const user = auth.currentUser;
          await setDoc(familyDocRef(), {
            ...state,
            updatedAt: serverTimestamp(),
            updatedBy: user ? user.email : 'unknown',
          }, { merge: false });
        } catch (e) {
          console.warn('Save failed:', e);
        } finally {
          saveTimer = null;
        }
      }, 500);
    }

    // ---------- Render ----------
    function $(id) { return document.getElementById(id); }

    function render() {
      const root = $('app');
      const tIdx = todayIdx();
      let body = '';

      // Top nav (always shown)
      body += `
        <div class="top-nav">
          <button class="nav-btn ${view !== 'parent' && view !== 'dev' ? 'active' : ''}" data-view="picker">Kids tablet</button>
          <button class="nav-btn ${view === 'parent' ? 'active' : ''}" data-view="parent">Parent CFO</button>
          ${devTabUnlocked ? `<button class="nav-btn ${view === 'dev' ? 'active' : ''}" data-view="dev" style="background:#FCEBEB;color:#A32D2D">🛠 Dev</button>` : ''}
          <div class="top-nav-right">
            <button class="icon-btn" id="sound-toggle" aria-label="Toggle sound">
              <i class="ti ti-volume${soundOn ? '' : '-off'}" style="font-size:16px"></i>
            </button>
            <button class="icon-btn" id="signout-btn" aria-label="Sign out">
              <i class="ti ti-logout" style="font-size:16px"></i>
            </button>
          </div>
        </div>
      `;

      if (view === 'parent') body += renderParent(tIdx);
      else if (view === 'dev' && devTabUnlocked) body += renderDevTab();
      else if (view === 'kid' && activeKid) body += renderKid(activeKid, tIdx);
      else body += renderPicker();

      root.innerHTML = body;
      attachHandlers();
      // Auto-scroll the grid horizontally so today is visible
      if (view === 'kid' && activeKid) {
        const scroll = document.querySelector('.grid-scroll');
        const todayHeader = document.querySelector('.grid-header-day.today');
        if (scroll && todayHeader) {
          // Scroll so today's column sits near the visible right edge
          const target = todayHeader.offsetLeft - 100;
          scroll.scrollTo({ left: Math.max(0, target), behavior: 'auto' });
        }
      }
      // Check for unviewed bonuses when kid enters their view
      if (view === 'kid' && activeKid) {
        const k = state.kids[activeKid];
        const unviewed = (k.bonusHistory || []).filter(b => b.unviewed);
        if (unviewed.length > 0) {
          showBonusCelebration(k, unviewed);
        }
      }
    }

    function showBonusCelebration(kid, unviewedBonuses) {
      // Take the most recent unviewed bonus to highlight, mark all as viewed
      const latest = unviewedBonuses[unviewedBonuses.length - 1];
      const others = unviewedBonuses.length - 1;

      $('modal-root').innerHTML = `
        <div class="modal-backdrop" id="celebrate-backdrop" style="background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);animation:fadeIn 0.3s ease">
          <div class="modal celebrate-modal" style="max-width:420px;text-align:center;padding:2rem 1.5rem;background:${kid.bgColor};animation:popIn 0.4s ease">
            <div style="font-size:80px;line-height:1;margin-bottom:8px;animation:bounce 0.6s ease 0.2s">${latest.emoji || '⭐'}</div>
            <p style="font-size:14px;font-weight:500;margin:0;color:${kid.textColor};opacity:0.7;text-transform:uppercase;letter-spacing:1px">You earned</p>
            <p style="font-size:36px;font-weight:600;margin:6px 0;color:${kid.textColor}">${latest.value || 'Bonus'}</p>
            <p style="font-size:15px;margin:0;color:${kid.textColor};opacity:0.85;line-height:1.4">"${latest.reason}"</p>
            <p style="font-size:24px;font-weight:500;margin:16px 0 0;color:${kid.textColor}">+${fmt(latest.amount)}</p>
            ${others > 0 ? `<p style="font-size:11px;margin:12px 0 0;color:${kid.textColor};opacity:0.65">+${others} more bonus${others > 1 ? 'es' : ''} earned</p>` : ''}
            <button id="celebrate-close" style="margin-top:20px;background:${kid.textColor};color:white;border:none;padding:14px 32px;border-radius:var(--radius-lg);font-size:16px;font-weight:500">Awesome!</button>
          </div>
        </div>
      `;

      // Mark all unviewed as viewed
      unviewedBonuses.forEach(b => { b.unviewed = false; });
      scheduleSave();

      playBonusFanfare();

      $('celebrate-close').onclick = () => {
        closeModal();
        render();
      };
      $('celebrate-backdrop').onclick = (e) => {
        if (e.target.id === 'celebrate-backdrop') {
          closeModal();
          render();
        }
      };
    }

    function renderPicker() {
      const tIdx = todayIdx();
      return `
        ${renderPickerFamilyDashboard(tIdx)}
        <div class="picker">
          <p class="picker-title">Who's tapping today?</p>
          <div class="picker-grid">
            ${Object.entries(state.kids).map(([id, k]) => {
              const hasPhoto = !!k.photoURL;
              const avatarStyle = hasPhoto
                ? `background-image:url('${k.photoURL}')`
                : `background:${k.textColor}`;
              const chores = k.chores || [];
              let todayScheduled = 0, todayDone = 0;
              chores.forEach(c => {
                if (c.schedule[tIdx]) {
                  todayScheduled++;
                  if (c.history[tIdx] === 'done') todayDone++;
                }
              });
              const pct = todayScheduled ? (todayDone / todayScheduled) : 0;
              const allDone = todayScheduled > 0 && todayDone === todayScheduled;
              const longestStreak = chores.reduce((a, c) => Math.max(a, c.streak || 0), 0);
              const C = 314.16;
              const dashOffset = C * (1 - pct);
              const ringColor = allDone ? '#0F6E56' : k.accentColor;
              const hasUnviewedBonus = (k.bonusHistory || []).some(b => b.unviewed);
              return `
              <button class="kid-tile" data-kid="${id}" style="background:${k.bgColor};position:relative">
                <div class="kid-avatar-wrap" style="position:relative;display:inline-block">
                  <svg width="120" height="120" style="display:block;transform:rotate(-90deg)" aria-hidden="true">
                    <circle cx="60" cy="60" r="50" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="6"/>
                    <circle cx="60" cy="60" r="50" fill="none" stroke="${ringColor}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${dashOffset}" style="transition:stroke-dashoffset 0.5s ease"/>
                  </svg>
                  <div class="kid-avatar ${hasPhoto ? 'has-photo' : ''}" style="${avatarStyle};position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:90px;height:90px">${hasPhoto ? '' : k.avatar}</div>
                  ${allDone ? `<div style="position:absolute;top:-2px;right:-2px;background:#0F6E56;color:white;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid ${k.bgColor}"><i class="ti ti-check" style="font-size:18px"></i></div>` : ''}
                </div>
                <p style="font-size:22px;font-weight:500;margin:8px 0 0;color:${k.textColor}">${k.name}</p>
                <p style="font-size:13px;margin:2px 0 0;color:${k.textColor};opacity:0.85">
                  ${todayScheduled === 0
                    ? `Nothing today \u2014 enjoy!`
                    : `${todayDone}/${todayScheduled} done today`}
                  ${longestStreak >= 3 ? ` \u00b7 \ud83d\udd25 ${longestStreak}` : ''}
                </p>
                ${hasUnviewedBonus ? `<div style="position:absolute;top:8px;right:8px;background:#BA7517;color:white;font-size:11px;padding:3px 8px;border-radius:10px;font-weight:500;animation:bounce 1.5s ease infinite">✨ New!</div>` : ''}
              </button>
            `;}).join('')}
          </div>
        </div>
      `;
    }

    function renderPickerFamilyDashboard(tIdx) {
      // Family today: total scheduled and done across all kids
      let famScheduled = 0, famDone = 0;
      Object.values(state.kids).forEach(k => {
        (k.chores || []).forEach(c => {
          if (c.schedule[tIdx]) {
            famScheduled++;
            if (c.history[tIdx] === 'done') famDone++;
          }
        });
      });

      // Weekly inflow into jars (from history)
      const weekStart = new Date(); weekStart.setDate(weekStart.getDate() - tIdx); weekStart.setHours(0,0,0,0);
      const weekStartISO = weekStart.toISOString().slice(0, 10);
      let weeklyEarnings = 0;
      Object.values(state.kids).forEach(k => {
        ['saveHistory','giveHistory'].forEach(field => {
          (k[field] || []).forEach(h => {
            if (h.type === 'in' && h.date >= weekStartISO) weeklyEarnings += h.amount;
          });
        });
      });
      // saveHistory has 20% of earnings, giveHistory has 10%, so total earnings = (save+give) / 0.3 ... but simpler: track sum of all bonus.amount + chore approved this week
      // Actually a cleaner approach: sum from bonusHistory + recompute approved chore earnings
      let actualEarned = 0;
      Object.values(state.kids).forEach(k => {
        (k.bonusHistory || []).forEach(b => { if (b.date >= weekStartISO) actualEarned += b.amount; });
        // approved chores: walk chore history but we don't store approval-date per chore tick; use saveHistory*5 as proxy isn't great
        // Simplest: weeklyEarnings approximation using saveHistory entries (since save = 20% of every earning event)
      });
      // Use saveHistory inflow * 5 (since save=20% of the total earned event) as best estimate
      let estimated = 0;
      Object.values(state.kids).forEach(k => {
        (k.saveHistory || []).forEach(h => {
          if (h.type === 'in' && h.date >= weekStartISO) estimated += h.amount * 5;
        });
      });

      // Recent value moments (last 5 across all kids)
      const moments = [];
      Object.entries(state.kids).forEach(([kidId, k]) => {
        (k.bonusHistory || []).forEach(b => {
          if (b.value) moments.push({ ...b, kidName: k.name, kidColor: k.textColor });
        });
      });
      moments.sort((a, b) => (a.date < b.date ? 1 : -1));
      const recentMoments = moments.slice(0, 5);

      const values = state.familyValues || [];
      const today = new Date().toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' });

      // Motto of the day — cycle through familyMottos by day-of-year
      const mottos = state.familyMottos || [];
      const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / 86400000);
      const motto = mottos.length > 0 ? mottos[dayOfYear % mottos.length] : null;

      return `
        <div class="family-dashboard">
          <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px">
            <p style="font-size:13px;font-weight:500;margin:0;color:var(--text-secondary)">${today}</p>
          </div>
          ${motto ? `
            <div style="padding:14px;background:linear-gradient(135deg, #FAECE7 0%, #E1F5EE 100%);border-radius:var(--radius-md);margin-bottom:12px;text-align:center">
              <p style="font-size:11px;color:var(--text-secondary);margin:0 0 4px;text-transform:uppercase;letter-spacing:0.8px">Today's motto</p>
              <p style="font-size:17px;font-weight:500;margin:0;font-style:italic">"${motto}"</p>
            </div>
          ` : ''}
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
            <div style="padding:10px;background:var(--bg-secondary);border-radius:var(--radius-md)">
              <p style="font-size:11px;color:var(--text-secondary);margin:0;text-transform:uppercase;letter-spacing:0.5px">Family today</p>
              <p style="font-size:18px;font-weight:500;margin:4px 0 0">${famScheduled === 0 ? 'No chores' : `${famDone}/${famScheduled} done`}</p>
            </div>
            <div style="padding:10px;background:var(--bg-secondary);border-radius:var(--radius-md)">
              <p style="font-size:11px;color:var(--text-secondary);margin:0;text-transform:uppercase;letter-spacing:0.5px">Earned this week</p>
              <p style="font-size:18px;font-weight:500;margin:4px 0 0;color:#0F6E56">+${fmt(estimated)}</p>
            </div>
          </div>
          ${values.length > 0 ? `
            <div style="margin-bottom:10px">
              <p style="font-size:11px;color:var(--text-secondary);margin:0 0 6px;text-transform:uppercase;letter-spacing:0.5px">Our values</p>
              <div style="display:flex;flex-wrap:wrap;gap:6px">
                ${values.map(v => `<span style="display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:var(--bg-secondary);border-radius:999px;font-size:12px;border:0.5px solid var(--border)"><span style="font-size:14px">${v.emoji || '⭐'}</span><span>${v.name}</span></span>`).join('')}
              </div>
            </div>
          ` : ''}
          ${recentMoments.length > 0 ? `
            <div>
              <p style="font-size:11px;color:var(--text-secondary);margin:0 0 6px;text-transform:uppercase;letter-spacing:0.5px">Recent moments</p>
              <div style="display:flex;flex-direction:column;gap:4px">
                ${recentMoments.map(m => `
                  <div style="display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 0">
                    <span style="font-size:16px">${m.emoji || '⭐'}</span>
                    <span><strong style="color:${m.kidColor}">${m.kidName}</strong> earned <strong>${m.value}</strong></span>
                    <span style="margin-left:auto;color:var(--text-tertiary);font-size:11px">${formatDateShort(m.date)}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderKid(kidId, tIdx) {
      const k = state.kids[kidId];
      const total = (k.spend || 0) + (k.save || 0) + (k.give || 0);
      const hasPhoto = !!k.photoURL;
      const headerAvatarStyle = hasPhoto
        ? `background-image:url('${k.photoURL}')`
        : `background:${k.textColor}`;
      return `
        <div class="kid-header" style="background:${k.bgColor}">
          <div class="kid-header-left">
            <div class="kid-header-avatar ${hasPhoto ? 'has-photo' : ''}" style="${headerAvatarStyle}">${hasPhoto ? '' : k.avatar}</div>
            <div>
              <p style="font-size:18px;font-weight:500;margin:0;color:${k.textColor}">Hi ${k.name}!</p>
              <p style="font-size:13px;margin:2px 0 0;color:${k.textColor};opacity:0.75">${DAY_NAMES[tIdx]} · Total earned ${fmt(total)}</p>
            </div>
          </div>
          <button class="back-btn" id="back-btn" style="color:${k.textColor};border-color:${k.accentColor}">← Switch</button>
        </div>
        ${renderJars(k)}
        <div style="margin-top:1.5rem">
          <div style="display:flex;align-items:baseline;justify-content:space-between;margin:0 0 12px">
            <p style="font-size:15px;font-weight:500;margin:0">This week</p>
            <p style="font-size:12px;color:var(--text-secondary);margin:0">Tap today or yesterday to mark done</p>
          </div>
          ${renderChoreGrid(k, tIdx)}
        </div>
        ${renderKidRecentValues(k)}
        ${renderKidFamilyValues()}
      `;
    }

    function renderKidFamilyValues() {
      const values = state.familyValues || [];
      if (values.length === 0) return '';
      return `
        <div class="card" style="margin-top:1rem">
          <p style="font-size:13px;font-weight:500;margin:0 0 8px">Our family values</p>
          <div style="display:flex;flex-wrap:wrap;gap:8px">
            ${values.map(v => `
              <span class="value-pill" style="display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:0.5px solid var(--border);background:var(--bg-secondary);border-radius:999px;font-size:12px">
                <span style="font-size:16px">${v.emoji || '⭐'}</span>
                <span>${v.name}</span>
              </span>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderKidRecentValues(k) {
      const recent = (k.bonusHistory || []).filter(b => b.value).slice(-5).reverse();
      if (recent.length === 0) return '';
      return `
        <div class="card" style="margin-top:1rem">
          <p style="font-size:13px;font-weight:500;margin:0 0 8px">${k.name}'s recent moments</p>
          <div style="display:flex;flex-direction:column;gap:8px">
            ${recent.map(b => `
              <div style="display:flex;align-items:center;gap:10px;padding:8px;background:var(--bg-secondary);border-radius:var(--radius-md)">
                <span style="font-size:20px">${b.emoji || '⭐'}</span>
                <div style="flex:1;min-width:0">
                  <p style="font-size:12px;font-weight:500;margin:0">${b.value}</p>
                  <p style="font-size:11px;color:var(--text-secondary);margin:2px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${b.reason}</p>
                </div>
                <p style="font-size:11px;color:var(--text-tertiary);margin:0;flex-shrink:0">${formatDateShort(b.date)}</p>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function formatDateShort(iso) {
      if (!iso) return '';
      const d = new Date(iso + 'T12:00:00');
      const now = new Date();
      const days = Math.floor((now - d) / 86400000);
      if (days === 0) return 'today';
      if (days === 1) return 'yesterday';
      if (days < 7) return `${days}d ago`;
      return d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
    }

    function renderJars(k) {
      const jars = [
        { name: 'Spend', amount: k.spend || 0, color: '#378ADD', bgColor: '#E6F1FB', icon: 'ti-shopping-cart', pct: 70, action: 'spend' },
        { name: 'Save',  amount: k.save  || 0, color: '#1D9E75', bgColor: '#E1F5EE', icon: 'ti-pig-money',     pct: 20 },
        { name: 'Give',  amount: k.give  || 0, color: '#D4537E', bgColor: '#FBEAF0', icon: 'ti-heart',         pct: 10 },
      ];
      const maxJar = Math.max(...jars.map(j => j.amount), 10);
      const goal = k.goal || {};
      const showGoal = goal.enabled && goal.target > 0;
      return `
        <div class="jars">
          ${jars.map(j => {
            const fillH = Math.min(100, (j.amount / maxJar) * 100);
            const isSpendActionable = j.action === 'spend' && (k.spend || 0) > 0;
            const idAttr = isSpendActionable ? 'id="spend-jar-action"' : '';
            const cursorStyle = isSpendActionable ? 'cursor:pointer' : '';
            const canSpendHint = isSpendActionable ? `<p style="font-size:9px;margin:2px 0 0;color:${j.color};opacity:0.7">tap to spend</p>` : '';
            return `
              <div class="jar" ${idAttr} style="background:${j.bgColor};${cursorStyle}">
                <div class="jar-glass" style="width:50px;height:60px;border-color:${j.color};border-width:3px">
                  <div class="jar-fill" style="background:${j.color};height:${fillH}%"></div>
                  <i class="ti ${j.icon} jar-icon" style="font-size:20px;color:${j.color}"></i>
                </div>
                <p style="font-size:12px;font-weight:500;margin:0;color:${j.color}">${j.name}</p>
                <p style="font-size:16px;font-weight:500;margin:2px 0 0;color:${j.color}">${fmt(j.amount)}</p>
                <p style="font-size:10px;margin:2px 0 0;color:${j.color};opacity:0.7">${j.pct}%</p>
                ${canSpendHint}
              </div>
            `;
          }).join('')}
        </div>
        ${showGoal ? renderGoalBar(k) : ''}
      `;
    }

    function renderGoalBar(k) {
      const goal = k.goal || {};
      const matched = (k.save || 0) * (goal.matchRatio || 0);
      const total = (k.save || 0) + matched;
      const pct = Math.min(100, Math.round(100 * total / goal.target));
      return `
        <div style="margin-top:12px;padding:12px;background:var(--bg-secondary);border-radius:var(--radius-md);border:0.5px solid var(--border)">
          <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
            <p style="font-size:13px;font-weight:500;margin:0">🎯 ${goal.name}</p>
            <p style="font-size:13px;margin:0;color:#0F6E56;font-weight:500">${fmt(total)} / ${fmt(goal.target)}</p>
          </div>
          <div style="height:8px;background:var(--bg-primary);border-radius:4px;overflow:hidden">
            <div style="height:100%;width:${pct}%;background:#0F6E56;transition:width 0.4s ease"></div>
          </div>
          ${goal.matchRatio > 0 ? `<p style="font-size:11px;color:var(--text-secondary);margin:6px 0 0">incl. ${goal.matchRatio}:1 match (${fmt(matched)}). Keep saving!</p>` : ''}
        </div>
      `;
    }

    function renderChoreGrid(k, tIdx) {
      const chores = k.chores || [];
      const routines = chores.filter(c => !c.paid);
      const extras = chores.filter(c => c.paid);
      // Effective tap size: explicit override wins, else standard
      const tapSize = k.tapSize || 'standard';
      const tapClass = tapSize === 'big' ? 'tap-big'
                     : tapSize === 'extra-big' ? 'tap-extra-big'
                     : tapSize === 'huge' ? 'tap-huge'
                     : '';
      const sectionHeader = (label, sub) => `
        <div style="display:flex;align-items:baseline;gap:8px;padding:10px 0 4px;border-top:0.5px solid var(--border);margin-top:8px">
          <p style="font-size:12px;font-weight:500;margin:0;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px">${label}</p>
          <p style="font-size:11px;color:var(--text-tertiary);margin:0">${sub}</p>
        </div>`;
      const headerRow = `
        <div class="grid-header">
          <div></div>
          ${DAYS.map((d, i) => `
            <div class="grid-header-day ${i === tIdx ? 'today' : ''}">${d}</div>
          `).join('')}
        </div>`;
      return `
        <div class="chore-grid ${tapClass}">
          <div class="grid-scroll">
            ${headerRow}
            ${routines.length ? sectionHeader('🌟 Routines', 'being part of the family') : ''}
            ${routines.map(c => renderChoreRow(c, k, tIdx)).join('')}
            ${extras.length ? sectionHeader('💼 Paid jobs', `extras you can earn money on`) : ''}
            ${extras.map(c => renderChoreRow(c, k, tIdx)).join('')}
          </div>
        </div>
      `;
    }

    function renderChoreRow(c, k, tIdx) {
      const iconCircle = 30;
      const iconSize = 16;
      const titleSize = 13;
      const history = c.history || [];
      const moneyLabel = c.paid
        ? `<span style="font-size:11px;color:var(--text-secondary)">${fmt(c.amount)}</span>`
        : `<span style="font-size:10px;color:var(--text-tertiary);background:var(--bg-tertiary);padding:1px 6px;border-radius:8px">routine</span>`;
      return `
        <div class="chore-row">
          <div class="chore-info">
            <div class="chore-icon-circle" style="width:${iconCircle}px;height:${iconCircle}px;background:${k.bgColor}">
              <i class="ti ${c.icon}" style="font-size:${iconSize}px;color:${k.textColor}"></i>
            </div>
            <div style="min-width:0;flex:1">
              <p class="chore-title" style="font-size:${titleSize}px">${c.title}${c.hardWork ? ' 💪' : ''}${c.schoolReady ? ' 🎒' : ''}</p>
              <div class="chore-meta">
                ${moneyLabel}
                ${(c.streak || 0) >= 3 ? `<span style="font-size:11px;color:#BA7517"><i class="ti ti-flame" style="font-size:12px;vertical-align:-1px"></i> ${c.streak}</span>` : ''}
              </div>
            </div>
          </div>
          ${history.map((status, dIdx) => renderDayCell(status, dIdx, c, k, tIdx)).join('')}
        </div>
      `;
    }

    function renderDayCell(status, dIdx, chore, k, tIdx) {
      const isToday = dIdx === tIdx;
      const isYesterday = dIdx === tIdx - 1;
      const isFuture = dIdx > tIdx;
      const todayClass = isToday ? 'today' : '';

      let inner = '', bg = 'transparent', border = 'none', clickable = '';

      if (status === 'na') inner = '<span style="color:var(--text-tertiary);font-size:11px">—</span>';
      else if (status === 'locked' || isFuture) inner = '<i class="ti ti-lock" style="font-size:11px;color:var(--text-tertiary)"></i>';
      else if (status === 'done') {
        inner = '<i class="ti ti-check" style="font-size:16px;color:white"></i>';
        bg = '#1D9E75';
      } else if (status === 'pending') {
        inner = '<i class="ti ti-clock" style="font-size:14px;color:#BA7517"></i>';
        bg = 'var(--warning-bg)'; border = '0.5px solid var(--warning-text)';
        // Allow untick on today only — yesterday's pending should sit and wait for parent
        if (isToday) clickable = `tickable" data-chore="${chore.id}" data-day="${dIdx}`;
      } else if (status === 'missed') {
        if (isYesterday) {
          border = `1px dashed ${k.accentColor}`;
          clickable = `tickable" data-chore="${chore.id}" data-day="${dIdx}`;
          inner = `<span style="color:${k.accentColor};font-size:16px;font-weight:500">+</span>`;
        } else {
          inner = '<i class="ti ti-x" style="font-size:14px;color:var(--text-tertiary)"></i>';
          border = '0.5px solid var(--border)';
        }
      } else if (status === 'available') {
        if (isToday || isYesterday) {
          bg = isToday ? k.bgColor : 'transparent';
          border = isToday ? `1px solid ${k.accentColor}` : `1px dashed ${k.accentColor}`;
          clickable = `tickable" data-chore="${chore.id}" data-day="${dIdx}`;
          inner = `<span style="color:${k.accentColor};font-size:18px;font-weight:500">+</span>`;
        } else {
          inner = '<i class="ti ti-x" style="font-size:14px;color:var(--text-tertiary)"></i>';
          border = '0.5px solid var(--border)';
        }
      }
      return `<div class="day-cell ${todayClass} ${clickable}" style="background:${bg};border:${border}">${inner}</div>`;
    }

    function renderParent(tIdx) {
      const totals = Object.values(state.kids).reduce((acc, k) => ({
        spend: acc.spend + (k.spend || 0),
        save:  acc.save  + (k.save  || 0),
        give:  acc.give  + (k.give  || 0),
      }), { spend: 0, save: 0, give: 0 });
      const grand = totals.spend + totals.save + totals.give;

      const note = generateManagerNote(tIdx);

      return `
        <div class="card">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
            <div>
              <p style="font-size:16px;font-weight:500;margin:0">Family CFO</p>
              <p style="font-size:13px;margin:2px 0 0;color:var(--text-secondary)">${new Date().toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' })}</p>
            </div>
            ${state.pendingApprovals.length ? `<div style="background:var(--info-bg);color:var(--info-text);padding:4px 12px;border-radius:var(--radius-md);font-size:12px;font-weight:500"><i class="ti ti-bell" style="font-size:13px;vertical-align:-1px"></i> ${state.pendingApprovals.length} pending</div>` : ''}
          </div>
          <div class="stat-grid">
            <div class="stat-card" style="background:var(--bg-secondary)">
              <p class="stat-label" style="color:var(--text-secondary)">Family wealth</p>
              <p class="stat-value">${fmt(grand)}</p>
            </div>
            <div class="stat-card" style="background:#E6F1FB">
              <p class="stat-label" style="color:#185FA5">Spend</p>
              <p class="stat-value" style="color:#185FA5">${fmt(totals.spend)}</p>
            </div>
            <div class="stat-card" style="background:#E1F5EE">
              <p class="stat-label" style="color:#0F6E56">Save</p>
              <p class="stat-value" style="color:#0F6E56">${fmt(totals.save)}</p>
            </div>
            <div class="stat-card" style="background:#FBEAF0">
              <p class="stat-label" style="color:#993556">Give</p>
              <p class="stat-value" style="color:#993556">${fmt(totals.give)}</p>
            </div>
          </div>
        </div>

        ${renderActionPrompts()}
        ${renderDashboard(tIdx)}
        ${renderFamilyValues()}

        <div class="card">
          <p style="font-size:14px;font-weight:500;margin:0 0 12px"><i class="ti ti-clock" style="font-size:16px;vertical-align:-2px;color:var(--warning-text)"></i> Pending approvals</p>
          ${state.pendingApprovals.length === 0
            ? `<p style="font-size:13px;color:var(--text-secondary);margin:0;padding:1rem 0;text-align:center">All caught up.</p>`
            : state.pendingApprovals.map((p, i) => {
              const k = state.kids[p.kid];
              const hasPhoto = !!k.photoURL;
              const apvStyle = hasPhoto ? `background-image:url('${k.photoURL}')` : `background:${k.textColor}`;
              return `
                <div class="approval-row">
                  <div class="approval-avatar ${hasPhoto ? 'has-photo' : ''}" style="${apvStyle}">${hasPhoto ? '' : k.avatar}</div>
                  <div style="flex:1;min-width:0">
                    <p style="font-size:14px;margin:0;font-weight:500">${p.chore}${p.hardWork ? ' 💪' : ''}</p>
                    <p style="font-size:12px;margin:2px 0 0;color:var(--text-secondary)">${k.name} · ${fmt(p.amount)} · ${p.time}</p>
                  </div>
                  <button class="approve-btn" data-idx="${i}">Approve</button>
                  <button class="reject-btn" data-idx="${i}">Reject</button>
                </div>
              `;
            }).join('')}
        </div>

        ${renderChoreManagement()}

        <div class="card">
          <p style="font-size:14px;font-weight:500;margin:0 0 8px"><i class="ti ti-settings" style="font-size:16px;vertical-align:-2px"></i> Settings</p>
          <div style="display:flex;flex-direction:column;gap:6px">
            <button id="change-pin-btn" style="text-align:left;padding:10px 12px;border:0.5px solid var(--border);background:var(--bg-primary);border-radius:var(--radius-md);font-size:13px"><i class="ti ti-lock" style="font-size:14px;vertical-align:-1px;margin-right:6px"></i><strong>Change Parent PIN</strong> — update your 4-digit unlock code</button>
          </div>
        </div>

        <div class="manager-note">
          <i class="ti ti-sparkles" style="font-size:20px;flex-shrink:0;margin-top:2px"></i>
          <div>
            <p style="font-size:13px;font-weight:500;margin:0">Manager's note</p>
            <p style="font-size:12px;margin:4px 0 0;line-height:1.5">${note}</p>
          </div>
        </div>
      `;
    }

    // ---------- Action prompts (Save transfer + Give quarterly) ----------
    function getCurrentQuarter() {
      const d = new Date();
      return `${d.getFullYear()}-Q${Math.floor(d.getMonth()/3) + 1}`;
    }

    function renderActionPrompts() {
      const prompts = [];
      const SAVE_THRESHOLD = 20;

      Object.entries(state.kids).forEach(([kidId, k]) => {
        if ((k.save || 0) >= SAVE_THRESHOLD) {
          prompts.push(`
            <div class="action-prompt save-prompt">
              <i class="ti ti-arrow-up-right" style="font-size:18px;flex-shrink:0;color:#0F6E56"></i>
              <div style="flex:1">
                <p style="font-size:13px;margin:0;font-weight:500">Time to transfer ${k.name}'s savings</p>
                <p style="font-size:12px;margin:2px 0 0;color:var(--text-secondary)">${fmt(k.save)} ready to move into a real high-interest account (ING/UBank/ME).</p>
              </div>
              <button class="save-transfer-btn" data-kid="${kidId}" style="border:none;background:#0F6E56;color:white;padding:8px 14px;border-radius:var(--radius-md);font-size:12px;font-weight:500;flex-shrink:0">Mark transferred</button>
            </div>
          `);
        }
      });

      // Quarterly Give prompt — only fires once per calendar quarter
      const currentQ = getCurrentQuarter();
      if (state.lastGiveQuarter !== currentQ) {
        const totalGive = Object.values(state.kids).reduce((a, k) => a + (k.give || 0), 0);
        if (totalGive >= 5) {
          prompts.push(`
            <div class="action-prompt give-prompt">
              <i class="ti ti-heart" style="font-size:18px;flex-shrink:0;color:#993556"></i>
              <div style="flex:1">
                <p style="font-size:13px;margin:0;font-weight:500">Time to give! 🎁</p>
                <p style="font-size:12px;margin:2px 0 0;color:var(--text-secondary)">Quarterly giving — pick a charity together with the boys. Total to give: ${fmt(totalGive)}.</p>
              </div>
              <button id="give-quarterly-btn" style="border:none;background:#993556;color:white;padding:8px 14px;border-radius:var(--radius-md);font-size:12px;font-weight:500;flex-shrink:0">Choose charity</button>
            </div>
          `);
        }
      }

      if (!prompts.length) return '';
      return `<div class="card" style="background:#FFF8EC">${prompts.join('')}</div>`;
    }

    // ---------- Parent dashboard ----------
    function renderDashboard(tIdx) {
      return `
        <div class="card">
          <p style="font-size:14px;font-weight:500;margin:0 0 12px"><i class="ti ti-chart-bar" style="font-size:16px;vertical-align:-2px"></i> This week</p>
          <div style="display:flex;flex-direction:column;gap:10px">
            ${Object.entries(state.kids).map(([kidId, k]) => renderDashboardKid(kidId, k, tIdx)).join('')}
          </div>
        </div>
      `;
    }

    function renderDashboardKid(kidId, k, tIdx) {
      // Count this-week stats
      const chores = k.chores || [];
      let scheduledThisWeek = 0, doneThisWeek = 0, paidEarnedThisWeek = 0, longestStreak = 0;
      chores.forEach(c => {
        c.schedule.forEach((s, i) => {
          if (!s) return;
          // Only count up to today (don't count future days as "missed")
          if (i > tIdx) return;
          scheduledThisWeek++;
          if (c.history[i] === 'done') {
            doneThisWeek++;
            if (c.paid) paidEarnedThisWeek += c.amount;
          }
        });
        if ((c.streak || 0) > longestStreak) longestStreak = c.streak;
      });
      const pct = scheduledThisWeek ? Math.round(100 * doneThisWeek / scheduledThisWeek) : 0;
      const target = k.age; // Barefoot age formula = $1 × age per week
      const targetPct = Math.min(100, Math.round(100 * paidEarnedThisWeek / target));
      const pendingForKid = state.pendingApprovals.filter(p => p.kid === kidId).length;

      const hasPhoto = !!k.photoURL;
      const dashAvatarStyle = hasPhoto
        ? `background-image:url('${k.photoURL}')`
        : `background:${k.textColor};color:white`;

      const goal = k.goal || {};
      const goalRow = goal.enabled && goal.target > 0
        ? (() => {
            const matched = (k.save || 0) * (goal.matchRatio || 1);
            const total = (k.save || 0) + matched;
            const goalPct = Math.min(100, Math.round(100 * total / goal.target));
            return `
              <div style="margin-top:8px;padding:8px;background:var(--bg-primary);border-radius:var(--radius-md)">
                <div style="display:flex;justify-content:space-between;align-items:baseline">
                  <p style="font-size:11px;font-weight:500;margin:0"><i class="ti ti-target" style="font-size:11px;vertical-align:-1px"></i> ${goal.name}</p>
                  <p style="font-size:11px;margin:0;color:var(--text-secondary)">${fmt(total)} / ${fmt(goal.target)}</p>
                </div>
                <div style="height:6px;background:var(--bg-secondary);border-radius:3px;overflow:hidden;margin-top:6px">
                  <div style="height:100%;width:${goalPct}%;background:${k.textColor}"></div>
                </div>
                <p style="font-size:10px;color:var(--text-tertiary);margin:4px 0 0">incl. ${goal.matchRatio}:1 parent match (${fmt(matched)})</p>
              </div>
            `;
          })()
        : '';

      return `
        <div style="background:var(--bg-secondary);padding:12px;border-radius:var(--radius-md)">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
            <div style="width:40px;height:40px;border-radius:50%;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-weight:500;${dashAvatarStyle}">${hasPhoto ? '' : k.avatar}</div>
            <div style="flex:1">
              <p style="font-size:14px;font-weight:500;margin:0">${k.name}</p>
              <p style="font-size:11px;color:var(--text-secondary);margin:2px 0 0">Age ${k.age} · target ${fmt(target)}/wk</p>
            </div>
            ${pendingForKid ? `<div style="background:var(--warning-bg);color:var(--warning-text);padding:2px 8px;border-radius:8px;font-size:11px;font-weight:500">${pendingForKid} pending</div>` : ''}
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
            <div style="padding:8px;background:var(--bg-primary);border-radius:var(--radius-md)">
              <p style="font-size:10px;color:var(--text-secondary);margin:0;text-transform:uppercase;letter-spacing:0.5px">Chores</p>
              <p style="font-size:16px;font-weight:500;margin:2px 0 0">${doneThisWeek}/${scheduledThisWeek}</p>
              <div style="height:4px;background:var(--bg-secondary);border-radius:2px;overflow:hidden;margin-top:6px">
                <div style="height:100%;width:${pct}%;background:${k.textColor}"></div>
              </div>
            </div>
            <div style="padding:8px;background:var(--bg-primary);border-radius:var(--radius-md)">
              <p style="font-size:10px;color:var(--text-secondary);margin:0;text-transform:uppercase;letter-spacing:0.5px">Earned</p>
              <p style="font-size:16px;font-weight:500;margin:2px 0 0">${fmt(paidEarnedThisWeek)}</p>
              <div style="height:4px;background:var(--bg-secondary);border-radius:2px;overflow:hidden;margin-top:6px">
                <div style="height:100%;width:${targetPct}%;background:${k.textColor}"></div>
              </div>
            </div>
          </div>
          <div style="display:flex;gap:12px;font-size:11px;color:var(--text-secondary)">
            <span><i class="ti ti-flame" style="font-size:11px;vertical-align:-1px;color:#BA7517"></i> Best streak: ${longestStreak} days</span>
            <span style="margin-left:auto;display:flex;gap:8px">
              <span style="color:#185FA5">${fmt(k.spend || 0)}</span>
              <span style="color:#0F6E56">${fmt(k.save || 0)}</span>
              <span style="color:#993556">${fmt(k.give || 0)}</span>
            </span>
          </div>
          <div style="display:flex;gap:6px;margin-top:8px">
            <button class="bonus-btn" data-kid="${kidId}" style="flex:1;border:0.5px solid var(--border);background:var(--bg-primary);padding:8px;border-radius:var(--radius-md);font-size:12px;font-weight:500"><i class="ti ti-sparkles" style="font-size:13px;vertical-align:-1px;color:#BA7517"></i> Bonus</button>
            <button class="kid-detail-btn" data-kid="${kidId}" style="flex:1;border:0.5px solid var(--border);background:var(--bg-primary);padding:8px;border-radius:var(--radius-md);font-size:12px"><i class="ti ti-eye" style="font-size:13px;vertical-align:-1px"></i> View ${k.name}'s view</button>
          </div>
          ${goalRow}
        </div>
      `;
    }

    // ---------- Dev tab (destructive testing tools) ----------
    function renderDevTab() {
      const familyDocSize = JSON.stringify(state).length;
      const totalChores = Object.values(state.kids).reduce((a, k) => a + (k.chores || []).length, 0);
      const totalApprovals = (state.pendingApprovals || []).length;
      const totalCash = Object.values(state.kids).reduce((a, k) => a + (k.spend || 0) + (k.save || 0) + (k.give || 0), 0);

      return `
        <div class="card" style="border:1px solid var(--danger-text);background:#FFF8F8">
          <p style="font-size:14px;font-weight:500;margin:0 0 8px;color:var(--danger-text)"><i class="ti ti-tools" style="font-size:16px;vertical-align:-2px"></i> Developer / testing tools</p>
          <p style="font-size:12px;color:var(--text-secondary);margin:0 0 12px">⚠️ These actions are destructive. Used for testing during development. Each requires you to type the confirmation word to proceed.</p>
