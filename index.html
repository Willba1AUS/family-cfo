<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0F6E56">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="app-icon-192.png">
  <link rel="apple-touch-icon" href="app-icon-192.png">
  <title>Family CFO</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <style>
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f5f5f0;
      --bg-tertiary: #ebebe5;
      --text-primary: #1a1a1a;
      --text-secondary: #6f6e6a;
      --text-tertiary: #9a9a95;
      --border: rgba(0,0,0,0.12);
      --border-strong: rgba(0,0,0,0.25);
      --info-bg: #E6F1FB;
      --info-text: #185FA5;
      --success-bg: #E1F5EE;
      --success-text: #0F6E56;
      --warning-bg: #FAEEDA;
      --warning-text: #BA7517;
      --danger-bg: #FCEBEB;
      --danger-text: #A32D2D;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --app-zoom: 1;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      font-size: 16px;
      line-height: 1.5;
      overscroll-behavior: none;
    }
    body { min-height: 100vh; min-height: 100dvh; }
    #app {
      max-width: 900px;
      margin: 0 auto;
      padding: 1rem;
      min-height: 100vh;
    }
    button { font-family: inherit; cursor: pointer; }
    input, select { font-family: inherit; }

    /* Login screen */
    #login-screen {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; padding: 2rem;
      background: var(--bg-primary);
    }
    .login-card {
      background: var(--bg-primary);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 2rem;
      max-width: 360px; width: 100%;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .login-card h1 { font-size: 22px; font-weight: 500; margin: 0 0 8px; }
    .login-card p { color: var(--text-secondary); margin: 0 0 1.5rem; font-size: 14px; }
    .login-input {
      width: 100%; padding: 12px; border: 0.5px solid var(--border);
      border-radius: var(--radius-md); font-size: 15px; margin-bottom: 10px;
      background: var(--bg-primary);
    }
    .login-btn {
      width: 100%; padding: 12px; border: none;
      background: #0F6E56; color: white;
      border-radius: var(--radius-md); font-size: 15px; font-weight: 500;
      margin-top: 6px;
    }
    .login-btn:disabled { opacity: 0.5; }
    .login-error { color: var(--danger-text); font-size: 13px; margin-top: 8px; }
    .login-hint { font-size: 12px; color: var(--text-tertiary); margin-top: 1rem; line-height: 1.6; }

    /* Top nav */
    .top-nav {
      display: flex; gap: 8px; align-items: center;
      padding: 4px; background: var(--bg-secondary);
      border-radius: var(--radius-lg); width: fit-content;
      margin-bottom: 1rem;
    }
    .nav-btn {
      border: none; padding: 8px 14px; border-radius: var(--radius-md);
      font-size: 13px; font-weight: 500;
      background: transparent; color: var(--text-secondary);
    }
    .nav-btn.active { background: var(--bg-primary); color: var(--text-primary); }
    .top-nav-right {
      margin-left: auto; display: flex; gap: 8px; align-items: center;
    }
    .icon-btn {
      border: 0.5px solid var(--border); background: var(--bg-primary);
      width: 34px; height: 34px; border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
    }

    /* Kid picker */
    .picker {
      background: var(--bg-secondary);
      border-radius: var(--radius-xl); padding: 2.5rem 2rem;
      min-height: 360px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .picker-title { font-size: 18px; font-weight: 500; margin: 0 0 1.75rem; }
    .picker-grid { display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center; }
    .kid-tile {
      border: none; border-radius: var(--radius-xl);
      padding: 1.5rem 2rem;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      min-width: 180px;
      transition: transform 0.15s;
    }
    .kid-tile:active { transform: scale(0.97); }
    .kid-avatar {
      width: 84px; height: 84px; border-radius: 50%;
      color: white;
      display: flex; align-items: center; justify-content: center;
      font-size: 38px; font-weight: 500;
    }

    /* Kid view */
    .kid-header {
      border-radius: var(--radius-xl); padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .kid-header-left { display: flex; align-items: center; gap: 12px; }
    .kid-header-avatar {
      width: 48px; height: 48px; border-radius: 50%;
      color: white; display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 500;
    }
    .back-btn {
      border: 0.5px solid currentColor; background: transparent;
      padding: 6px 12px; border-radius: var(--radius-md); font-size: 13px;
    }

    /* Jars */
    .jars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .jar {
      border-radius: var(--radius-xl); padding: 0.875rem; text-align: center;
    }
    .jar-glass {
      position: relative;
      margin: 0 auto 8px;
      border-style: solid; border-top: none;
      border-radius: 0 0 10px 10px;
      overflow: hidden; background: white;
    }
    .jar-fill {
      position: absolute; bottom: 0; left: 0; right: 0;
      opacity: 0.7; transition: height 0.6s ease;
    }
    .jar-icon {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
    }

    /* Chore grid */
    .chore-grid {
      background: var(--bg-primary);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-xl);
      overflow: hidden; margin-top: 12px;
    }
    .grid-header {
      display: grid; grid-template-columns: 1fr repeat(7, 36px); gap: 0;
      padding: 10px 12px 6px;
      border-bottom: 0.5px solid var(--border);
      background: var(--bg-secondary);
    }
    .grid-header-day {
      text-align: center; font-size: 11px; font-weight: 500;
      color: var(--text-secondary); text-transform: uppercase;
    }
    .grid-header-day.today { color: var(--info-text); }
    .grid-header-day.today::after {
      content: ''; display: block; width: 4px; height: 4px;
      background: var(--info-text); border-radius: 50%;
      margin: 2px auto 0;
    }
    .chore-row {
      display: grid; grid-template-columns: 1fr repeat(7, 36px); gap: 0;
      padding: 12px; align-items: center;
      border-bottom: 0.5px solid var(--border);
    }
    .chore-row:last-child { border-bottom: none; }
    .chore-info { display: flex; align-items: center; gap: 10px; min-width: 0; padding-right: 8px; }
    .chore-icon-circle {
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .chore-title {
      font-weight: 500; margin: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .chore-meta { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
    .audio-btn {
      border: none;
      width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: transform 0.15s ease;
    }
    .audio-btn:active { transform: scale(0.9); }
    .audio-btn.speaking { background: var(--info-bg) !important; }

    /* Day cells */
    .day-cell {
      width: 28px; height: 28px; margin: 0 auto;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s ease;
    }
    .day-cell.today { box-shadow: 0 0 0 2px var(--info-text); }
    .day-cell.tickable { cursor: pointer; }
    .day-cell.tickable:active { transform: scale(0.92); }

    /* Tap-size variants: scale ENTIRE chore row, not just the day cell */
    /* Big */
    .chore-grid.tap-big .grid-header,
    .chore-grid.tap-big .chore-row {
      grid-template-columns: 1fr repeat(7, 48px);
    }
    .chore-grid.tap-big .chore-row { padding: 14px 10px; }
    .chore-grid.tap-big .chore-icon-circle { width: 44px !important; height: 44px !important; }
    .chore-grid.tap-big .chore-icon-circle .ti { font-size: 22px !important; }
    .chore-grid.tap-big .chore-title { font-size: 15px !important; }
    .chore-grid.tap-big .day-cell { width: 40px; height: 40px; border-radius: 8px; }
    .chore-grid.tap-big .day-cell .ti { font-size: 20px !important; }
    .chore-grid.tap-big .day-cell span { font-size: 22px !important; }
    .chore-grid.tap-big .grid-header-day { font-size: 13px; }

    /* Extra big */
    .chore-grid.tap-extra-big .grid-header,
    .chore-grid.tap-extra-big .chore-row {
      grid-template-columns: 1fr repeat(7, 60px);
    }
    .chore-grid.tap-extra-big .chore-row { padding: 18px 12px; }
    .chore-grid.tap-extra-big .chore-icon-circle { width: 56px !important; height: 56px !important; }
    .chore-grid.tap-extra-big .chore-icon-circle .ti { font-size: 28px !important; }
    .chore-grid.tap-extra-big .chore-title { font-size: 17px !important; }
    .chore-grid.tap-extra-big .day-cell { width: 52px; height: 52px; border-radius: 10px; }
    .chore-grid.tap-extra-big .day-cell .ti { font-size: 26px !important; }
    .chore-grid.tap-extra-big .day-cell span { font-size: 28px !important; }
    .chore-grid.tap-extra-big .grid-header-day { font-size: 14px; }

    /* Huge */
    .chore-grid.tap-huge .grid-header,
    .chore-grid.tap-huge .chore-row {
      grid-template-columns: 1fr repeat(7, 76px);
    }
    .chore-grid.tap-huge .chore-row { padding: 22px 14px; }
    .chore-grid.tap-huge .chore-icon-circle { width: 68px !important; height: 68px !important; }
    .chore-grid.tap-huge .chore-icon-circle .ti { font-size: 36px !important; }
    .chore-grid.tap-huge .chore-title { font-size: 19px !important; }
    .chore-grid.tap-huge .day-cell { width: 68px; height: 68px; border-radius: 12px; }
    .chore-grid.tap-huge .day-cell .ti { font-size: 34px !important; }
    .chore-grid.tap-huge .day-cell span { font-size: 36px !important; }
    .chore-grid.tap-huge .grid-header-day { font-size: 16px; }

    /* Cards */
    .card {
      background: var(--bg-primary);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
    }
    .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    @media (min-width: 600px) { .stat-grid { grid-template-columns: repeat(4, 1fr); } }
    .stat-card { border-radius: var(--radius-md); padding: 0.875rem; }
    .stat-label {
      font-size: 11px; margin: 0;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .stat-value { font-size: 22px; font-weight: 500; margin: 4px 0 0; }

    /* Burst animation */
    @keyframes burst {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
    }
    .burst { animation: burst 0.6s ease forwards; pointer-events: none; }

    /* Approval rows */
    .approval-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 0;
      border-bottom: 0.5px solid var(--border);
    }
    .approval-row:last-child { border-bottom: none; }
    .approval-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      color: white;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 500; flex-shrink: 0;
    }
    .approve-btn {
      border: none; background: var(--success-bg); color: var(--success-text);
      padding: 6px 12px; border-radius: var(--radius-md);
      font-size: 12px; font-weight: 500;
    }
    .reject-btn {
      border: 0.5px solid var(--border); background: transparent;
      color: var(--text-secondary);
      padding: 6px 12px; border-radius: var(--radius-md); font-size: 12px;
    }

    /* Manager note */
    .manager-note {
      background: var(--info-bg);
      border-radius: var(--radius-xl);
      padding: 1rem 1.25rem;
      display: flex; gap: 12px; align-items: flex-start;
      color: var(--info-text);
    }

    /* Voice picker */
    .voice-row {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 1rem; flex-wrap: wrap;
      font-size: 12px; color: var(--text-secondary);
    }
    .voice-row select {
      font-size: 12px; padding: 5px 8px;
      border-radius: var(--radius-md); border: 0.5px solid var(--border);
      background: var(--bg-primary); max-width: 280px;
    }
    .voice-row button {
      border: 0.5px solid var(--border); background: var(--bg-primary);
      padding: 5px 10px; border-radius: var(--radius-md);
      font-size: 11px;
    }

    /* Loading */
    #loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-primary); z-index: 9999;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: #0F6E56;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Connection status */
    .conn-status {
      position: fixed; top: 8px; right: 8px;
      padding: 4px 10px; border-radius: var(--radius-md);
      font-size: 11px; z-index: 100;
      display: none;
    }
    .conn-status.offline {
      display: block;
      background: var(--warning-bg); color: var(--warning-text);
    }

    /* Add chore form */
    .form-row {
      display: flex; flex-direction: column; gap: 6px;
      margin-bottom: 12px;
    }
    .form-row label { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
    .form-row input, .form-row select {
      padding: 10px; border: 0.5px solid var(--border);
      border-radius: var(--radius-md); font-size: 14px;
      background: var(--bg-primary);
    }
    .day-toggles { display: flex; gap: 4px; flex-wrap: wrap; }
    .day-toggle {
      width: 36px; height: 36px; border: 0.5px solid var(--border);
      background: var(--bg-primary); border-radius: var(--radius-md);
      font-size: 12px; font-weight: 500;
    }
    .day-toggle.active { background: #0F6E56; color: white; border-color: #0F6E56; }

    /* Chore management */
    .chore-mgmt-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 0;
      border-bottom: 0.5px solid var(--border);
    }
    .chore-mgmt-row:last-child { border-bottom: none; }
    .chore-mgmt-row .reorder-btns {
      display: flex; flex-direction: column; gap: 2px;
    }
    .chore-mgmt-row .reorder-btn {
      width: 24px; height: 18px; border: 0.5px solid var(--border);
      background: var(--bg-primary); border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      padding: 0; color: var(--text-secondary);
    }
    .chore-mgmt-row .reorder-btn:disabled { opacity: 0.3; }
    .chore-mgmt-row .edit-chore-btn {
      border: none; background: transparent; color: var(--info-text);
      padding: 4px;
    }

    /* Kid avatar with photo */
    .kid-avatar.has-photo, .kid-header-avatar.has-photo, .approval-avatar.has-photo {
      background-size: cover; background-position: center; color: transparent;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; padding: 1rem;
    }
    .modal {
      background: var(--bg-primary); border-radius: var(--radius-xl);
      width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto;
      padding: 1.25rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .modal h2 { font-size: 16px; font-weight: 500; margin: 0 0 1rem; }
    .modal-actions {
      display: flex; gap: 8px; margin-top: 1rem;
    }
    .modal-actions .save {
      flex: 1; background: #0F6E56; color: white; border: none;
      padding: 12px; border-radius: var(--radius-md);
      font-size: 14px; font-weight: 500;
    }
    .modal-actions .cancel {
      border: 0.5px solid var(--border); background: var(--bg-primary);
      padding: 12px 16px; border-radius: var(--radius-md);
      font-size: 14px;
    }

    /* Icon picker */
    .icon-picker {
      display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px;
      max-height: 220px; overflow-y: auto;
      padding: 8px; background: var(--bg-secondary);
      border-radius: var(--radius-md);
    }
    .icon-pick-btn {
      width: 100%; aspect-ratio: 1; border: 0.5px solid var(--border);
      background: var(--bg-primary); border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      padding: 0;
    }
    .icon-pick-btn.selected {
      background: #0F6E56; color: white; border-color: #0F6E56;
    }

    /* Photo upload */
    .photo-upload-wrap {
      display: flex; align-items: center; gap: 12px;
    }
    .photo-preview {
      width: 60px; height: 60px; border-radius: 50%;
      background: var(--bg-tertiary);
      background-size: cover; background-position: center;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-secondary); font-size: 22px; font-weight: 500;
      flex-shrink: 0;
    }
    .photo-upload-wrap input[type="file"] { display: none; }
    .photo-upload-btn {
      border: 0.5px solid var(--border); background: var(--bg-primary);
      padding: 8px 14px; border-radius: var(--radius-md); font-size: 13px;
    }
    .photo-upload-btn.removing { color: var(--danger-text); }

    /* Mode toggle */
    .mode-toggle {
      display: flex; gap: 4px;
    }
    .mode-toggle-btn {
      flex: 1; padding: 8px;
      border: 0.5px solid var(--border); background: var(--bg-primary);
      border-radius: var(--radius-md); font-size: 12px; font-weight: 500;
      color: var(--text-primary);
    }
    .mode-toggle-btn.active {
      background: #0F6E56; color: white; border-color: #0F6E56;
    }

    /* Action prompts (Save transfer, Give quarterly) */
    .action-prompt {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 0;
      border-bottom: 0.5px solid var(--border);
    }
    .action-prompt:last-child { border-bottom: none; }

    /* Flag toggle (schoolReady / hardWork) */
    .flag-toggle {
      display: flex; gap: 6px; flex-wrap: wrap;
    }
    .flag-toggle button {
      padding: 6px 12px; border: 0.5px solid var(--border);
      background: var(--bg-primary); border-radius: var(--radius-md);
      font-size: 12px;
    }
    .flag-toggle button.active {
      background: var(--bg-tertiary); border-color: var(--text-primary);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div id="loading"><div class="spinner"></div></div>
  <div class="conn-status" id="conn-status">Offline · changes saved locally</div>
  <div id="login-screen" style="display: none;">
    <div class="login-card">
      <h1>Family CFO</h1>
      <p>Sign in to continue</p>
      <input class="login-input" type="email" id="email" placeholder="Email" autocomplete="email">
      <input class="login-input" type="password" id="password" placeholder="Password" autocomplete="current-password">
      <button class="login-btn" id="signin-btn">Sign in</button>
      <div class="login-error" id="login-error"></div>
      <div class="login-hint">First time? Create accounts in Firebase Console → Authentication → Users.</div>
    </div>
  </div>
  <div id="app" style="display: none;"></div>
  <div id="modal-root"></div>

  <!-- Firebase v10 (modular) via CDN -->
  <script type="module">
    // Imports
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, setDoc, onSnapshot, enableIndexedDbPersistence,
      collection, addDoc, deleteDoc, updateDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import {
      getStorage, ref as storageRef, uploadBytes, getDownloadURL, deleteObject
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

    // Pull config from sibling file
    import { firebaseConfig, FAMILY_ID } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // Offline persistence
    try {
      await enableIndexedDbPersistence(db);
    } catch (e) {
      console.warn("Persistence not enabled:", e.code);
    }

    // ---------- Constants ----------
    const DAYS = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
    const DAY_NAMES = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
    function todayIdx() {
      // JS: Sun=0, Mon=1...Sat=6 — we want Mon=0...Sun=6
      const d = new Date().getDay();
      return d === 0 ? 6 : d - 1;
    }
    function fmt(n) { return '$' + (Number(n) || 0).toFixed(2); }

    // ---------- Photo helpers (resize before upload) ----------
    async function resizeImage(file, max = 256) {
      const dataUrl = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = rej;
        r.readAsDataURL(file);
      });
      const img = await new Promise((res, rej) => {
        const i = new Image();
        i.onload = () => res(i);
        i.onerror = rej;
        i.src = dataUrl;
      });
      // Square crop centered
      const side = Math.min(img.width, img.height);
      const sx = (img.width - side) / 2;
      const sy = (img.height - side) / 2;
      const canvas = document.createElement('canvas');
      canvas.width = max; canvas.height = max;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, sx, sy, side, side, 0, 0, max, max);
      return new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.85));
    }

    async function uploadKidPhoto(kidId, file) {
      const blob = await resizeImage(file, 256);
      const path = `families/${FAMILY_ID}/kids/${kidId}.jpg`;

    function ensureAudio() {
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch (e) { return null; }
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      // First-touch TTS warmup: fire a silent utterance to wake the engine
      if (!ttsWarmedUp && 'speechSynthesis' in window) {
        ttsWarmedUp = true;
        try {
          const u = new SpeechSynthesisUtterance(' ');
          u.volume = 0; u.rate = 1; u.pitch = 1;
          window.speechSynthesis.speak(u);
        } catch (e) {}
      }
      return audioCtx;
    }

    function playMarioCoin() {
      const ctx = ensureAudio(); if (!ctx || !soundOn) return;
      const t0 = ctx.currentTime;
      const master = ctx.createGain();
      master.gain.value = 0.16;
      master.connect(ctx.destination);
      const o1 = ctx.createOscillator();
      const g1 = ctx.createGain();
      o1.type = 'square';
      o1.frequency.setValueAtTime(987.77, t0);
      g1.gain.setValueAtTime(0, t0);
      g1.gain.linearRampToValueAtTime(1, t0 + 0.005);
      g1.gain.setValueAtTime(1, t0 + 0.085);
      g1.gain.linearRampToValueAtTime(0, t0 + 0.095);
      o1.connect(g1); g1.connect(master);
      o1.start(t0); o1.stop(t0 + 0.1);
      const o2 = ctx.createOscillator();
      const g2 = ctx.createGain();
      o2.type = 'square';
      o2.frequency.setValueAtTime(1318.51, t0 + 0.095);
      g2.gain.setValueAtTime(0, t0 + 0.095);
      g2.gain.linearRampToValueAtTime(1, t0 + 0.1);
      g2.gain.setValueAtTime(1, t0 + 0.36);
      g2.gain.exponentialRampToValueAtTime(0.001, t0 + 0.46);
      o2.connect(g2); g2.connect(master);
      o2.start(t0 + 0.095); o2.stop(t0 + 0.48);
    }

    function playApprovalChime() {
      const ctx = ensureAudio(); if (!ctx || !soundOn) return;
      [[1568,0,0.08],[2093,0.06,0.08],[2637,0.12,0.18]].forEach(([f,w,d]) => {
        const t0 = ctx.currentTime + w;
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(f, t0);
        g.gain.setValueAtTime(0, t0);
        g.gain.linearRampToValueAtTime(0.16, t0 + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
        osc.connect(g); g.connect(ctx.destination);
        osc.start(t0); osc.stop(t0 + d + 0.05);
      });
    }

    // ---------- TTS ----------
    function rankVoice(v) {
      const name = v.name.toLowerCase();
      const lang = (v.lang || '').toLowerCase();
      let score = 0;
      if (lang.includes('en-au') || lang.includes('en_au')) score += 100;
      else if (lang.startsWith('en')) score += 20;
      if (name.includes('network')) score += 30;
      if (name.includes('neural')) score += 30;
      if (name.includes('wavenet')) score += 35;
      if (name.includes('google') && (lang.includes('en-au') || name.includes('australia'))) score += 25;
      if (/-au[a-z]?-x-aua/i.test(v.name) || /-au[a-z]?-x-auc/i.test(v.name)) score += 15;
      if (name.includes('female')) score += 20;
      if (name.includes('karen') || name.includes('catherine') || name.includes('lisa')) score += 15;
      if (name.includes('male') && !name.includes('female')) score -= 15;
      if (/-au[a-z]?-x-aub/i.test(v.name) || /-au[a-z]?-x-aud/i.test(v.name)) score -= 10;
      return score;
    }

    function loadAllVoices() {
      if (!('speechSynthesis' in window)) return [];
      const voices = window.speechSynthesis.getVoices();
      return voices
        .filter(v => /^en/i.test(v.lang))
        .map(v => ({ voice: v, score: rankVoice(v) }))
        .sort((a, b) => b.score - a.score)
        .map(x => x.voice);
    }

    function speak(text, btnEl) {
      if (!soundOn) return;
      if (!('speechSynthesis' in window)) return;
      if (!chosenVoice) {
        const list = loadAllVoices();
        chosenVoice = list[0] || null;
        // restore saved voice from localStorage
        const savedName = localStorage.getItem('voice-name');
        if (savedName) {
          const v = list.find(v => v.name === savedName);
          if (v) chosenVoice = v;
        }
      }
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      if (chosenVoice) { u.voice = chosenVoice; u.lang = chosenVoice.lang; }
      else u.lang = 'en-AU';
      u.rate = 0.95; u.pitch = 1.0; u.volume = 1;
      if (btnEl) {
        btnEl.classList.add('speaking');
        u.onend = () => btnEl.classList.remove('speaking');
        u.onerror = () => btnEl.classList.remove('speaking');
      }
      window.speechSynthesis.speak(u);
    }

    async function loadState(user) {
      const ref = familyDocRef();
      const snap = await getDoc(ref);
      if (!snap.exists()) {
        // First run — seed with defaults
        await setDoc(ref, {
          ...DEFAULT_STATE,
          createdAt: serverTimestamp(),
          createdBy: user.email,
        });
        state = JSON.parse(JSON.stringify(DEFAULT_STATE));
      } else {
        const data = snap.data();
        // Strip Firestore-only fields
        delete data.createdAt; delete data.createdBy; delete data.updatedAt; delete data.updatedBy;
        state = data;
        // Ensure structure (in case schema evolves)
        if (!state.kids) state.kids = DEFAULT_STATE.kids;
        if (!state.pendingApprovals) state.pendingApprovals = [];
        migrateToV3();
      }
      maybeWeeklyReset();
    }

    function migrateToV3() {
      // Add paid, category, history arrays, goal — for any docs created before Batch 2
      Object.values(state.kids).forEach(kid => {
        if (!kid.spendHistory) kid.spendHistory = [];
        if (!kid.saveHistory) kid.saveHistory = [];
        if (!kid.giveHistory) kid.giveHistory = [];
        if (!kid.goal) kid.goal = { enabled: false, name: '', target: 0, matchRatio: 1 };
        if (!kid.tapSize) kid.tapSize = (kid.mode === 'pre-reader' ? 'big' : 'standard');
        (kid.chores || []).forEach(c => {
          if (c.paid === undefined) c.paid = (c.amount > 0); // existing chores with $ stay paid
          if (!c.category) c.category = c.paid ? 'extras' : 'routines';
          if (!c.paid) c.amount = 0; // ensure unpaid have $0
        });
      });
      if (!state.lastGiveQuarter) state.lastGiveQuarter = null;
    }

    function maybeWeeklyReset() {
      // If we've crossed into a new ISO week since last reset, clear history
      const now = new Date();
      const year = now.getFullYear();
      const onejan = new Date(year, 0, 1);
      const week = Math.ceil((((now - onejan) / 86400000) + onejan.getDay() + 1) / 7);
      const weekKey = `${year}-W${week}`;
      if (state.lastResetWeek !== weekKey) {
        // Reset history but preserve streaks if they were maintained
        Object.values(state.kids).forEach(kid => {
          kid.chores.forEach(chore => {
            const lastWeekFullyDone = chore.history.every((h, i) =>
              !chore.schedule[i] || h === 'done' || h === 'na'
            );
            chore.history = chore.schedule.map(s => s ? 'available' : 'na');
            // Streak persists if last week was fully done; otherwise reset
            if (!lastWeekFullyDone) chore.streak = 0;
          });
        });
        state.lastResetWeek = weekKey;
        scheduleSave();
      }
    }

    // Listen for remote changes
    function startListening() {
      if (unsubscribe) unsubscribe();
      unsubscribe = onSnapshot(familyDocRef(), (snap) => {
        if (!snap.exists()) return;
        // Don't override if save in flight
        if (saveTimer) return;
        const data = snap.data();
        delete data.createdAt; delete data.createdBy; delete data.updatedAt; delete data.updatedBy;
        // Only update if different
        if (JSON.stringify(data) !== JSON.stringify(state)) {
          state = data;
          if (!state.pendingApprovals) state.pendingApprovals = [];
          migrateToV3();
          render();
        }
      }, (err) => {

          <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
            <p style="font-size:13px;font-weight:500;margin:0">🎯 ${goal.name}</p>
            <p style="font-size:13px;margin:0;color:#0F6E56;font-weight:500">${fmt(total)} / ${fmt(goal.target)}</p>
          </div>
          <div style="height:8px;background:var(--bg-primary);border-radius:4px;overflow:hidden">
            <div style="height:100%;width:${pct}%;background:#0F6E56;transition:width 0.4s ease"></div>
          </div>
          ${goal.matchRatio > 0 ? `<p style="font-size:11px;color:var(--text-secondary);margin:6px 0 0">incl. ${goal.matchRatio}:1 match (${fmt(matched)}). Keep saving!</p>` : ''}
        </div>
      `;
    }

    function renderChoreGrid(k, isPre, tIdx) {
      const chores = k.chores || [];
      const routines = chores.filter(c => !c.paid);
      const extras = chores.filter(c => c.paid);
      // Effective tap size: explicit override wins, else pre-reader → big, else standard
      const tapSize = k.tapSize || (isPre ? 'big' : 'standard');
      const tapClass = tapSize === 'big' ? 'tap-big'
                     : tapSize === 'extra-big' ? 'tap-extra-big'
                     : tapSize === 'huge' ? 'tap-huge'
                     : '';
      const sectionHeader = (label, sub) => `
        <div style="display:flex;align-items:baseline;gap:8px;padding:10px 0 4px;border-top:0.5px solid var(--border);margin-top:8px">
          <p style="font-size:12px;font-weight:500;margin:0;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px">${label}</p>
          <p style="font-size:11px;color:var(--text-tertiary);margin:0">${sub}</p>
        </div>`;
      const headerRow = `
        <div class="grid-header">
          <div></div>
          ${DAYS.map((d, i) => `
            <div class="grid-header-day ${i === tIdx ? 'today' : ''}">${d}</div>
          `).join('')}
        </div>`;
      return `
        <div class="chore-grid ${tapClass}">
          ${headerRow}
          ${routines.length ? sectionHeader('🌟 Routines', 'being part of the family') : ''}
          ${routines.map(c => renderChoreRow(c, k, isPre, tIdx)).join('')}
          ${extras.length ? sectionHeader('💼 Paid jobs', `extras you can earn money on`) : ''}
          ${extras.map(c => renderChoreRow(c, k, isPre, tIdx)).join('')}
        </div>
      `;
    }

    function renderChoreRow(c, k, isPre, tIdx) {
      const iconCircle = isPre ? 42 : 30;
      const iconSize = isPre ? 24 : 16;
      const titleSize = isPre ? 15 : 13;
      const history = c.history || [];
      const moneyLabel = c.paid
        ? `<span style="font-size:11px;color:var(--text-secondary)">${fmt(c.amount)}</span>`
        : `<span style="font-size:10px;color:var(--text-tertiary);background:var(--bg-tertiary);padding:1px 6px;border-radius:8px">routine</span>`;
      return `
        <div class="chore-row">
          <div class="chore-info">
            <div class="chore-icon-circle" style="width:${iconCircle}px;height:${iconCircle}px;background:${k.bgColor}">
              <i class="ti ${c.icon}" style="font-size:${iconSize}px;color:${k.textColor}"></i>
            </div>
            <div style="min-width:0;flex:1">
              <div style="display:flex;align-items:center;gap:6px">
                <p class="chore-title" style="font-size:${titleSize}px">${c.title}${c.hardWork ? ' 💪' : ''}${c.schoolReady ? ' 🎒' : ''}</p>
                ${isPre ? `<button class="audio-btn" data-text="${c.title.replace(/"/g, '&quot;')}" style="background:${k.bgColor};color:${k.textColor}" aria-label="Hear chore name"><i class="ti ti-volume" style="font-size:14px"></i></button>` : ''}
              </div>
              <div class="chore-meta">
                ${moneyLabel}
                ${(c.streak || 0) >= 3 ? `<span style="font-size:11px;color:#BA7517"><i class="ti ti-flame" style="font-size:12px;vertical-align:-1px"></i> ${c.streak}</span>` : ''}
              </div>
            </div>
          </div>
          ${history.map((status, dIdx) => renderDayCell(status, dIdx, c, k, tIdx)).join('')}
        </div>
      `;
    }

    function renderDayCell(status, dIdx, chore, k, tIdx) {
      const isToday = dIdx === tIdx;
      const isYesterday = dIdx === tIdx - 1;
      const isFuture = dIdx > tIdx;
      const todayClass = isToday ? 'today' : '';

      let inner = '', bg = 'transparent', border = 'none', clickable = '';

      if (status === 'na') inner = '<span style="color:var(--text-tertiary);font-size:11px">—</span>';
      else if (status === 'locked' || isFuture) inner = '<i class="ti ti-lock" style="font-size:11px;color:var(--text-tertiary)"></i>';
      else if (status === 'done') {
        inner = '<i class="ti ti-check" style="font-size:16px;color:white"></i>';
        bg = '#1D9E75';
      } else if (status === 'pending') {
        inner = '<i class="ti ti-clock" style="font-size:14px;color:#BA7517"></i>';
        bg = 'var(--warning-bg)'; border = '0.5px solid var(--warning-text)';
        // Allow untick on today only — yesterday's pending should sit and wait for parent
        if (isToday) clickable = `tickable" data-chore="${chore.id}" data-day="${dIdx}`;
      } else if (status === 'missed') {
        if (isYesterday) {
          border = `1px dashed ${k.accentColor}`;
          clickable = `tickable" data-chore="${chore.id}" data-day="${dIdx}`;
          inner = `<span style="color:${k.accentColor};font-size:16px;font-weight:500">+</span>`;
        } else {
          inner = '<i class="ti ti-x" style="font-size:14px;color:var(--text-tertiary)"></i>';
          border = '0.5px solid var(--border)';
        }
      } else if (status === 'available') {
        if (isToday || isYesterday) {
          bg = isToday ? k.bgColor : 'transparent';
          border = isToday ? `1px solid ${k.accentColor}` : `1px dashed ${k.accentColor}`;
          clickable = `tickable" data-chore="${chore.id}" data-day="${dIdx}`;
          inner = `<span style="color:${k.accentColor};font-size:18px;font-weight:500">+</span>`;
        } else {
          inner = '<i class="ti ti-x" style="font-size:14px;color:var(--text-tertiary)"></i>';
          border = '0.5px solid var(--border)';
        }
      }
      return `<div class="day-cell ${todayClass} ${clickable}" style="background:${bg};border:${border}">${inner}</div>`;
    }

    function renderParent(tIdx) {
      const totals = Object.values(state.kids).reduce((acc, k) => ({
        spend: acc.spend + (k.spend || 0),
        save:  acc.save  + (k.save  || 0),
        give:  acc.give  + (k.give  || 0),
      }), { spend: 0, save: 0, give: 0 });
      const grand = totals.spend + totals.save + totals.give;

      const note = generateManagerNote(tIdx);

      return `
        <div class="card">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
            <div>
              <p style="font-size:16px;font-weight:500;margin:0">Family CFO</p>
              <p style="font-size:13px;margin:2px 0 0;color:var(--text-secondary)">${new Date().toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' })}</p>
            </div>
            ${state.pendingApprovals.length ? `<div style="background:var(--info-bg);color:var(--info-text);padding:4px 12px;border-radius:var(--radius-md);font-size:12px;font-weight:500"><i class="ti ti-bell" style="font-size:13px;vertical-align:-1px"></i> ${state.pendingApprovals.length} pending</div>` : ''}
          </div>
          <div class="stat-grid">
            <div class="stat-card" style="background:var(--bg-secondary)">
              <p class="stat-label" style="color:var(--text-secondary)">Family wealth</p>
              <p class="stat-value">${fmt(grand)}</p>
            </div>
            <div class="stat-card" style="background:#E6F1FB">
              <p class="stat-label" style="color:#185FA5">Spend</p>
              <p class="stat-value" style="color:#185FA5">${fmt(totals.spend)}</p>
            </div>
            <div class="stat-card" style="background:#E1F5EE">
              <p class="stat-label" style="color:#0F6E56">Save</p>
              <p class="stat-value" style="color:#0F6E56">${fmt(totals.save)}</p>
            </div>
            <div class="stat-card" style="background:#FBEAF0">
              <p class="stat-label" style="color:#993556">Give</p>
              <p class="stat-value" style="color:#993556">${fmt(totals.give)}</p>
            </div>
          </div>
        </div>

        ${renderActionPrompts()}
        ${renderDashboard(tIdx)}

        <div class="card">
          <p style="font-size:14px;font-weight:500;margin:0 0 12px"><i class="ti ti-clock" style="font-size:16px;vertical-align:-2px;color:var(--warning-text)"></i> Pending approvals</p>
          ${state.pendingApprovals.length === 0
            ? `<p style="font-size:13px;color:var(--text-secondary);margin:0;padding:1rem 0;text-align:center">All caught up.</p>`
            : state.pendingApprovals.map((p, i) => {
              const k = state.kids[p.kid];
              const hasPhoto = !!k.photoURL;
              const apvStyle = hasPhoto ? `background-image:url('${k.photoURL}')` : `background:${k.textColor}`;
              return `
                <div class="approval-row">
                  <div class="approval-avatar ${hasPhoto ? 'has-photo' : ''}" style="${apvStyle}">${hasPhoto ? '' : k.avatar}</div>
                  <div style="flex:1;min-width:0">
                    <p style="font-size:14px;margin:0;font-weight:500">${p.chore}${p.hardWork ? ' 💪' : ''}</p>
                    <p style="font-size:12px;margin:2px 0 0;color:var(--text-secondary)">${k.name} · ${fmt(p.amount)} · ${p.time}</p>
                  </div>
                  <button class="approve-btn" data-idx="${i}">Approve</button>
                  <button class="reject-btn" data-idx="${i}">Reject</button>
                </div>
              `;
            }).join('')}
        </div>

        ${renderChoreManagement()}

        ${renderDisplaySettings()}

        <div class="manager-note">
          <i class="ti ti-sparkles" style="font-size:20px;flex-shrink:0;margin-top:2px"></i>
          <div>
            <p style="font-size:13px;font-weight:500;margin:0">Manager's note</p>
            <p style="font-size:12px;margin:4px 0 0;line-height:1.5">${note}</p>
          </div>
        </div>
      `;
    }

    // ---------- Display settings (text scale, per-device) ----------
    function getTextScale() {
      return localStorage.getItem('text-scale') || 'standard';
    }
    function applyTextScale(scale) {
      // No-op for now — text scale temporarily disabled while we sort browser-compat issues.
      // Will revisit with a proper REM-based approach.
      localStorage.setItem('text-scale', scale);
    }

    function renderDisplaySettings() {
      const cur = getTextScale();
      const scales = [
        { id: 'compact', label: 'Compact' },
        { id: 'standard', label: 'Standard' },
        { id: 'large', label: 'Large' },
      ];
      return `
        <div class="card">
          <p style="font-size:14px;font-weight:500;margin:0 0 8px"><i class="ti ti-text-size" style="font-size:16px;vertical-align:-2px"></i> Display size</p>
          <p style="font-size:11px;color:var(--text-secondary);margin:0 0 10px">Affects only this device. Each device remembers its own setting.</p>
          <div class="mode-toggle">
            ${scales.map(s => `<button type="button" class="mode-toggle-btn text-scale-btn ${cur === s.id ? 'active' : ''}" data-scale="${s.id}">${s.label}</button>`).join('')}
          </div>
        </div>
      `;
    }

    // ---------- Action prompts (Save transfer + Give quarterly) ----------
    function getCurrentQuarter() {
      const d = new Date();
      return `${d.getFullYear()}-Q${Math.floor(d.getMonth()/3) + 1}`;
    }

    function renderActionPrompts() {
      const prompts = [];
      const SAVE_THRESHOLD = 20;

      Object.entries(state.kids).forEach(([kidId, k]) => {
        if ((k.save || 0) >= SAVE_THRESHOLD) {
          prompts.push(`
            <div class="action-prompt save-prompt">
              <i class="ti ti-arrow-up-right" style="font-size:18px;flex-shrink:0;color:#0F6E56"></i>
              <div style="flex:1">
                <p style="font-size:13px;margin:0;font-weight:500">Time to transfer ${k.name}'s savings</p>
                <p style="font-size:12px;margin:2px 0 0;color:var(--text-secondary)">${fmt(k.save)} ready to move into a real high-interest account (ING/UBank/ME).</p>
              </div>
              <button class="save-transfer-btn" data-kid="${kidId}" style="border:none;background:#0F6E56;color:white;padding:8px 14px;border-radius:var(--radius-md);font-size:12px;font-weight:500;flex-shrink:0">Mark transferred</button>
            </div>
          `);
        }
      });

      // Quarterly Give prompt — only fires once per calendar quarter
      const currentQ = getCurrentQuarter();
      if (state.lastGiveQuarter !== currentQ) {
        const totalGive = Object.values(state.kids).reduce((a, k) => a + (k.give || 0), 0);
        if (totalGive >= 5) {
          prompts.push(`
            <div class="action-prompt give-prompt">
              <i class="ti ti-heart" style="font-size:18px;flex-shrink:0;color:#993556"></i>
              <div style="flex:1">
                <p style="font-size:13px;margin:0;font-weight:500">Time to give! 🎁</p>
                <p style="font-size:12px;margin:2px 0 0;color:var(--text-secondary)">Quarterly giving — pick a charity together with the boys. Total to give: ${fmt(totalGive)}.</p>
              </div>
              <button id="give-quarterly-btn" style="border:none;background:#993556;color:white;padding:8px 14px;border-radius:var(--radius-md);font-size:12px;font-weight:500;flex-shrink:0">Choose charity</button>
            </div>
          `);
        }
      }

      if (!prompts.length) return '';
      return `<div class="card" style="background:#FFF8EC">${prompts.join('')}</div>`;
    }

    // ---------- Parent dashboard ----------
    function renderDashboard(tIdx) {
      return `
        <div class="card">
          <p style="font-size:14px;font-weight:500;margin:0 0 12px"><i class="ti ti-chart-bar" style="font-size:16px;vertical-align:-2px"></i> This week</p>
          <div style="display:flex;flex-direction:column;gap:10px">
            ${Object.entries(state.kids).map(([kidId, k]) => renderDashboardKid(kidId, k, tIdx)).join('')}
          </div>
        </div>
      `;
    }

    function renderDashboardKid(kidId, k, tIdx) {
      // Count this-week stats
      const chores = k.chores || [];
      let scheduledThisWeek = 0, doneThisWeek = 0, paidEarnedThisWeek = 0, longestStreak = 0;
      chores.forEach(c => {
        c.schedule.forEach((s, i) => {
          if (!s) return;
          // Only count up to today (don't count future days as "missed")
          if (i > tIdx) return;
          scheduledThisWeek++;
          if (c.history[i] === 'done') {
            doneThisWeek++;
            if (c.paid) paidEarnedThisWeek += c.amount;
          }
        });
        if ((c.streak || 0) > longestStreak) longestStreak = c.streak;
      });
      const pct = scheduledThisWeek ? Math.round(100 * doneThisWeek / scheduledThisWeek) : 0;
      const target = k.age; // Barefoot age formula = $1 × age per week
      const targetPct = Math.min(100, Math.round(100 * paidEarnedThisWeek / target));
      const pendingForKid = state.pendingApprovals.filter(p => p.kid === kidId).length;

      const hasPhoto = !!k.photoURL;
      const dashAvatarStyle = hasPhoto
        ? `background-image:url('${k.photoURL}')`
        : `background:${k.textColor};color:white`;

      const goal = k.goal || {};
      const goalRow = goal.enabled && goal.target > 0
        ? (() => {
            const matched = (k.save || 0) * (goal.matchRatio || 1);
            const total = (k.save || 0) + matched;
            const goalPct = Math.min(100, Math.round(100 * total / goal.target));
            return `
              <div style="margin-top:8px;padding:8px;background:var(--bg-primary);border-radius:var(--radius-md)">
                <div style="display:flex;justify-content:space-between;align-items:baseline">
                  <p style="font-size:11px;font-weight:500;margin:0"><i class="ti ti-target" style="font-size:11px;vertical-align:-1px"></i> ${goal.name}</p>
                  <p style="font-size:11px;margin:0;color:var(--text-secondary)">${fmt(total)} / ${fmt(goal.target)}</p>
                </div>
                <div style="height:6px;background:var(--bg-secondary);border-radius:3px;overflow:hidden;margin-top:6px">
                  <div style="height:100%;width:${goalPct}%;background:${k.textColor}"></div>
                </div>
                <p style="font-size:10px;color:var(--text-tertiary);margin:4px 0 0">incl. ${goal.matchRatio}:1 parent match (${fmt(matched)})</p>
              </div>
            `;
          })()
        : '';

      return `
        <div style="background:var(--bg-secondary);padding:12px;border-radius:var(--radius-md)">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
            <div style="width:40px;height:40px;border-radius:50%;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-weight:500;${dashAvatarStyle}">${hasPhoto ? '' : k.avatar}</div>
            <div style="flex:1">
              <p style="font-size:14px;font-weight:500;margin:0">${k.name}</p>
              <p style="font-size:11px;color:var(--text-secondary);margin:2px 0 0">Age ${k.age} · target ${fmt(target)}/wk</p>
            </div>
            ${pendingForKid ? `<div style="background:var(--warning-bg);color:var(--warning-text);padding:2px 8px;border-radius:8px;font-size:11px;font-weight:500">${pendingForKid} pending</div>` : ''}
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
            <div style="padding:8px;background:var(--bg-primary);border-radius:var(--radius-md)">
              <p style="font-size:10px;color:var(--text-secondary);margin:0;text-transform:uppercase;letter-spacing:0.5px">Chores</p>
              <p style="font-size:16px;font-weight:500;margin:2px 0 0">${doneThisWeek}/${scheduledThisWeek}</p>
              <div style="height:4px;background:var(--bg-secondary);border-radius:2px;overflow:hidden;margin-top:6px">
                <div style="height:100%;width:${pct}%;background:${k.textColor}"></div>
              </div>
            </div>
            <div style="padding:8px;background:var(--bg-primary);border-radius:var(--radius-md)">
              <p style="font-size:10px;color:var(--text-secondary);margin:0;text-transform:uppercase;letter-spacing:0.5px">Earned</p>
              <p style="font-size:16px;font-weight:500;margin:2px 0 0">${fmt(paidEarnedThisWeek)}</p>
              <div style="height:4px;background:var(--bg-secondary);border-radius:2px;overflow:hidden;margin-top:6px">
                <div style="height:100%;width:${targetPct}%;background:${k.textColor}"></div>
              </div>
            </div>
          </div>
          <div style="display:flex;gap:12px;font-size:11px;color:var(--text-secondary)">
            <span><i class="ti ti-flame" style="font-size:11px;vertical-align:-1px;color:#BA7517"></i> Best streak: ${longestStreak} days</span>
            <span style="margin-left:auto;display:flex;gap:8px">
              <span style="color:#185FA5">${fmt(k.spend || 0)}</span>
              <span style="color:#0F6E56">${fmt(k.save || 0)}</span>
              <span style="color:#993556">${fmt(k.give || 0)}</span>
            </span>
          </div>
          ${goalRow}
        </div>
      `;
    }

    function renderChoreManagement() {
      return `
        <div class="card">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
            <p style="font-size:14px;font-weight:500;margin:0"><i class="ti ti-list-check" style="font-size:16px;vertical-align:-2px"></i> Chore management</p>
            <button id="add-chore-btn" style="border:0.5px solid var(--border);background:var(--bg-primary);padding:6px 12px;border-radius:var(--radius-md);font-size:12px"><i class="ti ti-plus" style="font-size:13px;vertical-align:-1px"></i> Add chore</button>
          </div>

          ${Object.entries(state.kids).map(([kid, k]) => {
            const hasPhoto = !!k.photoURL;
            const mgmtAvatarStyle = hasPhoto
              ? `background-image:url('${k.photoURL}');background-size:cover;background-position:center`
              : `background:${k.textColor};color:white`;
            const chores = k.chores || [];
            return `
            <div style="margin-top:12px;padding:10px;background:var(--bg-secondary);border-radius:var(--radius-md)">
              <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
                <div style="width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:14px;${mgmtAvatarStyle}">${hasPhoto ? '' : k.avatar}</div>
                <div style="flex:1">
                  <p style="font-size:13px;font-weight:500;margin:0">${k.name}</p>
                  <p style="font-size:11px;margin:2px 0 0;color:var(--text-secondary)">Age ${k.age} · ${k.mode}</p>
                </div>
                <button class="edit-kid-btn" data-kid="${kid}" style="border:0.5px solid var(--border);background:var(--bg-primary);padding:6px 10px;border-radius:var(--radius-md);font-size:12px"><i class="ti ti-edit" style="font-size:12px;vertical-align:-1px"></i> Edit ${k.name}</button>
              </div>
              ${chores.map((c, idx) => `
                <div class="chore-mgmt-row">
                  <div class="reorder-btns">
                    <button class="reorder-btn move-chore-up" data-kid="${kid}" data-chore-id="${c.id}" ${idx === 0 ? 'disabled' : ''} aria-label="Move up"><i class="ti ti-chevron-up" style="font-size:12px"></i></button>
                    <button class="reorder-btn move-chore-down" data-kid="${kid}" data-chore-id="${c.id}" ${idx === chores.length - 1 ? 'disabled' : ''} aria-label="Move down"><i class="ti ti-chevron-down" style="font-size:12px"></i></button>
                  </div>
                  <i class="ti ${c.icon}" style="font-size:18px;color:${k.textColor}"></i>
                  <div style="flex:1;min-width:0">
                    <p style="font-size:13px;margin:0;font-weight:500">${c.title}${c.hardWork ? ' 💪' : ''}${c.schoolReady ? ' 🎒' : ''}</p>
                    <p style="font-size:11px;margin:2px 0 0;color:var(--text-secondary)">${fmt(c.amount)} · ${c.schedule.filter(Boolean).length} days/wk</p>
                  </div>
                  <button class="edit-chore-btn" data-kid="${kid}" data-chore-id="${c.id}" aria-label="Edit"><i class="ti ti-edit" style="font-size:16px"></i></button>
                  <button class="delete-chore-btn" data-kid="${kid}" data-chore-id="${c.id}" style="border:none;background:transparent;color:var(--danger-text);padding:4px"><i class="ti ti-trash" style="font-size:16px"></i></button>
                </div>
              `).join('')}
              ${chores.length === 0 ? `<p style="font-size:12px;color:var(--text-secondary);padding:8px 0;margin:0">No chores yet — tap "Add chore" above.</p>` : ''}
            </div>
          `;}).join('')}
        </div>
      `;
    }

    function generateManagerNote(tIdx) {
      const insights = [];
      Object.entries(state.kids).forEach(([id, k]) => {
        // Streaks
        const longStreaks = (k.chores || []).filter(c => (c.streak || 0) >= 3);
        if (longStreaks.length) {
          const top = longStreaks.sort((a,b) => (b.streak||0) - (a.streak||0))[0];
          insights.push(`${k.name} on a ${top.streak}-day streak with ${top.title.toLowerCase()} — call it out`);
        }
        // Repeat misses
        (k.chores || []).forEach(c => {
          const missedThisWeek = c.history.slice(0, tIdx).filter((h,i) => c.schedule[i] && h === 'missed').length;
          if (missedThisWeek >= 2) {
            insights.push(`${k.name} skipped "${c.title}" ${missedThisWeek}× this week — worth a chat`);
          }
        });
      });
      if (!insights.length) return "Nothing flagged this week. Keep an eye on streaks as they build.";
      return insights.slice(0, 2).join('. ') + '.';
    }

    function renderVoicePicker() {
      const select = $('voice-select');
      if (!select) return;
      if (!allVoices.length) allVoices = loadAllVoices();
      if (!allVoices.length) {
        select.innerHTML = '<option>Loading voices…</option>';
        return;
      }
      if (!chosenVoice && allVoices.length) {
        const savedName = localStorage.getItem('voice-name');
        chosenVoice = (savedName && allVoices.find(v => v.name === savedName)) || allVoices[0];
      }
      select.innerHTML = allVoices.map((v, i) => {
        const isAussie = /en[-_]?au/i.test(v.lang);
        const flag = isAussie ? '🇦🇺 ' : '';
        const sel = chosenVoice && v.name === chosenVoice.name ? 'selected' : '';
        return `<option value="${i}" ${sel}>${flag}${v.name} (${v.lang})</option>`;
      }).join('');
    }

    // ---------- Burst animation ----------
    function showBurst(x, y, color) {
      const el = document.createElement('div');
      el.className = 'burst';
      el.style.cssText = `position:fixed;left:${x}px;top:${y}px;width:32px;height:32px;background:${color};border-radius:50%;z-index:998`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 600);
    }

    // ---------- Handlers ----------
    function attachHandlers() {
      document.querySelectorAll('.nav-btn').forEach(b => {
        b.onclick = () => {
          ensureAudio();
          view = b.dataset.view === 'parent' ? 'parent' : 'picker';
          activeKid = null;
          render();
        };
      });
      document.querySelectorAll('.kid-tile').forEach(b => {
        b.onclick = () => {
          ensureAudio();
          // Small delay lets TTS engine finish warmup before real utterance
          setTimeout(() => speak(b.dataset.greeting), 150);
          activeKid = b.dataset.kid;
          view = 'kid';
          render();
        };
      });
      const back = $('back-btn');
      if (back) back.onclick = () => { view = 'picker'; activeKid = null; render(); };

      document.querySelectorAll('.audio-btn').forEach(b => {
        b.onclick = (e) => {
          e.stopPropagation();
          ensureAudio();
          speak(b.dataset.text, b);
        };
      });

      document.querySelectorAll('.day-cell.tickable').forEach(cell => {
        cell.onclick = () => {
          const choreId = cell.dataset.chore;
          const dIdx = parseInt(cell.dataset.day);
          const kid = state.kids[activeKid];
          const chore = kid.chores.find(c => c.id === choreId);
          if (!chore) return;
          const cur = chore.history[dIdx];

          // Untap pending — kid corrects accidental tap
          if (cur === 'pending') {
            chore.history[dIdx] = 'available';
            // Remove matching pending approval
            const apIdx = state.pendingApprovals.findIndex(p =>
              p.kid === activeKid && p.choreId === choreId && p.dayIdx === dIdx
            );
            if (apIdx >= 0) state.pendingApprovals.splice(apIdx, 1);
            scheduleSave();
            render();
            return;
          }

          if (cur !== 'available') return;

          // Unpaid (routine) — auto-complete, no approval, no money
          if (!chore.paid) {
            chore.history[dIdx] = 'done';
            let streak = 0;
            for (let i = dIdx; i >= 0; i--) {
              if (chore.history[i] === 'done') streak++;
              else if (chore.history[i] === 'na') continue;
              else break;
            }
            chore.streak = streak;
            playMarioCoin();
            const r = cell.getBoundingClientRect();
            showBurst(r.left + r.width/2, r.top + r.height/2, kid.accentColor);
            scheduleSave();
            render();
            return;
          }

          // Paid — go to pending for parent approval
          chore.history[dIdx] = 'pending';
          state.pendingApprovals.push({
            kid: activeKid, chore: chore.title, amount: chore.amount,
            time: dIdx === todayIdx() ? 'just now' : 'yesterday',
            dayIdx: dIdx, choreId, hardWork: chore.hardWork || false
          });
          playMarioCoin();
          const r = cell.getBoundingClientRect();
          showBurst(r.left + r.width/2, r.top + r.height/2, kid.accentColor);
          scheduleSave();
          render();
        };
      });

      document.querySelectorAll('.approve-btn').forEach(b => {
        b.onclick = () => {
          const idx = parseInt(b.dataset.idx);
          const p = state.pendingApprovals[idx];
          const kid = state.kids[p.kid];
          const chore = kid.chores.find(c => c.id === p.choreId);
          if (chore) {
            chore.history[p.dayIdx] = 'done';
            let streak = 0;
            for (let i = p.dayIdx; i >= 0; i--) {
              if (chore.history[i] === 'done') streak++;
              else if (chore.history[i] === 'na') continue;
              else break;
            }
            chore.streak = streak;
          }
          // 70/20/10 split + log to histories
          const today = new Date().toISOString().slice(0,10);
          const spendAmt = p.amount * 0.7;
          const saveAmt  = p.amount * 0.2;
          const giveAmt  = p.amount * 0.1;
          kid.spend = (kid.spend || 0) + spendAmt;
          kid.save  = (kid.save  || 0) + saveAmt;
          kid.give  = (kid.give  || 0) + giveAmt;
          if (!kid.saveHistory) kid.saveHistory = [];
          kid.saveHistory.push({ date: today, amount: saveAmt, type: 'in', note: p.chore });
          if (!kid.giveHistory) kid.giveHistory = [];
          kid.giveHistory.push({ date: today, amount: giveAmt, type: 'in', note: p.chore });
          state.pendingApprovals.splice(idx, 1);
          playApprovalChime();
          scheduleSave();
          render();
        };
      });
      document.querySelectorAll('.reject-btn').forEach(b => {
        b.onclick = () => {
          const idx = parseInt(b.dataset.idx);
          const p = state.pendingApprovals[idx];
          const kid = state.kids[p.kid];
          const chore = kid.chores.find(c => c.id === p.choreId);
          if (chore) chore.history[p.dayIdx] = 'available';
          state.pendingApprovals.splice(idx, 1);
          scheduleSave();
          render();
        };
      });

      // Sound + signout + voice
      const sb = $('sound-toggle');
      if (sb) sb.onclick = () => {
        soundOn = !soundOn;
        if (soundOn) ensureAudio();
        else if (window.speechSynthesis) window.speechSynthesis.cancel();
        sb.querySelector('i').className = soundOn ? 'ti ti-volume' : 'ti ti-volume-off';
      };
      const so = $('signout-btn');
      if (so) so.onclick = () => signOut(auth);

      const vs = $('voice-select');
      if (vs) {
        vs.onchange = () => {
          const i = parseInt(vs.value);
          if (allVoices[i]) {
            chosenVoice = allVoices[i];
            localStorage.setItem('voice-name', chosenVoice.name);
            speak('Hi, this is your test voice.');
          }
        };
      }
      const tv = $('test-voice');
      if (tv) tv.onclick = () => { ensureAudio(); speak('Hi! Time to do your chores.'); };

      // Chore management
      const addBtn = $('add-chore-btn');
      if (addBtn) addBtn.onclick = () => {
        // Default to first kid for "add" mode
        const firstKid = Object.keys(state.kids)[0];
        openChoreModal('add', firstKid);
      };

      document.querySelectorAll('.edit-chore-btn').forEach(b => {
        b.onclick = () => openChoreModal('edit', b.dataset.kid, b.dataset.choreId);
      });

      document.querySelectorAll('.edit-kid-btn').forEach(b => {
        b.onclick = () => openKidModal(b.dataset.kid);
      });

      document.querySelectorAll('.move-chore-up').forEach(b => {
        b.onclick = () => {
          const kid = b.dataset.kid;
          const cid = b.dataset.choreId;
          const arr = state.kids[kid].chores;
          const idx = arr.findIndex(c => c.id === cid);
          if (idx > 0) {
            [arr[idx-1], arr[idx]] = [arr[idx], arr[idx-1]];
            scheduleSave();
            render();
          }
        };
      });
      document.querySelectorAll('.move-chore-down').forEach(b => {
        b.onclick = () => {
          const kid = b.dataset.kid;
          const cid = b.dataset.choreId;
          const arr = state.kids[kid].chores;
          const idx = arr.findIndex(c => c.id === cid);
          if (idx >= 0 && idx < arr.length - 1) {
            [arr[idx+1], arr[idx]] = [arr[idx], arr[idx+1]];
            scheduleSave();
            render();
          }
        };
      });

      document.querySelectorAll('.delete-chore-btn').forEach(b => {
        b.onclick = () => {
          if (!confirm('Delete this chore?')) return;
          const kid = b.dataset.kid;
          const cid = b.dataset.choreId;
          state.kids[kid].chores = (state.kids[kid].chores || []).filter(c => c.id !== cid);
          scheduleSave();
          render();
        };
      });

      // Save transfer action
      document.querySelectorAll('.save-transfer-btn').forEach(b => {
        b.onclick = () => openSaveTransferModal(b.dataset.kid);
      });

      // Quarterly Give action
      const giveBtn = $('give-quarterly-btn');
      if (giveBtn) giveBtn.onclick = () => openGiveModal();

      // Spend jar tap-through (kid view)
      const spendJar = $('spend-jar-action');
      if (spendJar) spendJar.onclick = () => openSpendModal(activeKid);

      // Text scale buttons
      document.querySelectorAll('.text-scale-btn').forEach(b => {
        b.onclick = () => {
          applyTextScale(b.dataset.scale);
          render();
        };
      });
    }

    // ---------- Save transfer modal ----------
    function openSaveTransferModal(kidId) {
      const k = state.kids[kidId];
      $('modal-root').innerHTML = `
        <div class="modal-backdrop" id="save-modal-backdrop">
          <div class="modal">
            <h2>Transfer ${k.name}'s savings</h2>
            <p style="font-size:13px;color:var(--text-secondary);margin:0 0 12px">
              Move ${fmt(k.save)} from this app's Save jar to ${k.name}'s real high-interest bank account (e.g. ING, UBank, ME Bank).
            </p>
            <div class="form-row">
              <label>Amount to transfer ($)</label>
              <input type="number" id="m-save-amt" min="0" max="${k.save}" step="1" value="${Math.floor(k.save)}">
            </div>
            <div class="form-row">
              <label>Note (optional)</label>
              <input type="text" id="m-save-note" maxlength="40" placeholder="e.g. ING Orange Everyday">
            </div>
            <p style="font-size:12px;color:var(--text-secondary);margin:0 0 12px;line-height:1.4">
              <i class="ti ti-info-circle" style="font-size:13px;vertical-align:-1px"></i> 
              This logs the transfer in app history. <strong>You still need to do the actual bank transfer manually.</strong>
            </p>
            <div class="modal-actions">
              <button class="cancel" id="m-save-cancel">Cancel</button>
              <button class="save" id="m-save-confirm">I've transferred it</button>
            </div>
          </div>
        </div>
      `;
      $('save-modal-backdrop').onclick = (e) => { if (e.target.id === 'save-modal-backdrop') closeModal(); };
      $('m-save-cancel').onclick = closeModal;
      $('m-save-confirm').onclick = () => {
        const amt = parseFloat($('m-save-amt').value) || 0;
        const note = ($('m-save-note').value || 'Bank transfer').trim();
        if (amt <= 0 || amt > k.save) return alert('Enter a valid amount.');
        const today = new Date().toISOString().slice(0,10);
        k.save = Math.max(0, k.save - amt);
        if (!k.saveHistory) k.saveHistory = [];
        k.saveHistory.push({ date: today, amount: amt, type: 'out', note });
        scheduleSave();
        closeModal();
        render();
      };
    }

    // ---------- Quarterly Give modal ----------
    function openGiveModal() {
      const kidsArr = Object.entries(state.kids);
      $('modal-root').innerHTML = `
        <div class="modal-backdrop" id="give-modal-backdrop">
          <div class="modal">
            <h2>Time to give 🎁</h2>
            <p style="font-size:13px;color:var(--text-secondary);margin:0 0 12px">
              Pick a charity together with the boys. They learn most when they choose, and ideally hand over the money in person.
            </p>
            <div class="form-row">
              <label>Charity / cause</label>
              <input type="text" id="m-give-charity" maxlength="60" placeholder="e.g. The Smith Family, RSPCA, local food bank">
            </div>
            ${kidsArr.map(([id, k]) => `
              <div style="padding:10px;background:var(--bg-secondary);border-radius:var(--radius-md);margin-bottom:6px">
                <div style="display:flex;align-items:center;justify-content:space-between">
                  <p style="font-size:13px;font-weight:500;margin:0">${k.name}'s Give jar</p>
                  <p style="font-size:13px;margin:0;color:#993556;font-weight:500">${fmt(k.give || 0)}</p>
                </div>
                <label style="display:flex;align-items:center;gap:8px;font-size:12px;margin-top:6px">
                  <input type="checkbox" class="m-give-check" data-kid="${id}" ${(k.give || 0) > 0 ? 'checked' : 'disabled'}>
                  Give all of ${k.name}'s ${fmt(k.give || 0)}
                </label>
              </div>
            `).join('')}
            <div class="modal-actions">
              <button class="cancel" id="m-give-cancel">Skip for now</button>
              <button class="save" id="m-give-confirm">Mark donated</button>
            </div>
          </div>
        </div>
      `;
      $('give-modal-backdrop').onclick = (e) => { if (e.target.id === 'give-modal-backdrop') closeModal(); };
      $('m-give-cancel').onclick = closeModal;
      $('m-give-confirm').onclick = () => {
        const charity = ($('m-give-charity').value || '').trim();
        if (!charity) return alert('Please enter the charity or cause.');
        const today = new Date().toISOString().slice(0,10);
        document.querySelectorAll('.m-give-check').forEach(cb => {
          if (!cb.checked) return;
          const kid = state.kids[cb.dataset.kid];
          const amt = kid.give || 0;
          if (amt <= 0) return;
          kid.give = 0;
          if (!kid.giveHistory) kid.giveHistory = [];
          kid.giveHistory.push({ date: today, amount: amt, type: 'out', note: charity });
        });
        state.lastGiveQuarter = getCurrentQuarter();
        scheduleSave();
        closeModal();
        render();
      };
    }

    // ---------- Spend jar modal (kid records what they bought) ----------
    function openSpendModal(kidId) {
      const k = state.kids[kidId];
      $('modal-root').innerHTML = `
        <div class="modal-backdrop" id="spend-modal-backdrop">
          <div class="modal">
            <h2>${k.name}'s Spend jar</h2>
            <p style="font-size:13px;color:var(--text-secondary);margin:0 0 12px">
              Available: <strong style="color:#185FA5">${fmt(k.spend || 0)}</strong>
            </p>
            <div class="form-row">
              <label>What did you buy?</label>
              <input type="text" id="m-spend-item" maxlength="40" placeholder="e.g. Pokemon cards">
            </div>
            <div class="form-row">
              <label>How much did it cost ($)</label>
              <input type="number" id="m-spend-amt" min="0" max="${k.spend || 0}" step="0.5" value="${Math.min(5, k.spend || 0)}">
            </div>
            <div class="modal-actions">
              <button class="cancel" id="m-spend-cancel">Cancel</button>
              <button class="save" id="m-spend-confirm">Record purchase</button>
            </div>
          </div>
        </div>
      `;
      $('spend-modal-backdrop').onclick = (e) => { if (e.target.id === 'spend-modal-backdrop') closeModal(); };
      $('m-spend-cancel').onclick = closeModal;
      $('m-spend-confirm').onclick = () => {
        const item = ($('m-spend-item').value || '').trim();
        const amt = parseFloat($('m-spend-amt').value) || 0;
        if (!item) return alert('What did you buy?');
        if (amt <= 0 || amt > (k.spend || 0)) return alert('Check the amount.');
        const today = new Date().toISOString().slice(0,10);
        k.spend = Math.max(0, (k.spend || 0) - amt);
        if (!k.spendHistory) k.spendHistory = [];
        k.spendHistory.push({ date: today, amount: amt, type: 'out', note: item });
        scheduleSave();
        closeModal();
        render();
      };
    }

    // ---------- Auth flow ----------
    // Apply saved text scale on boot (before any render)
    applyTextScale(getTextScale());

    onAuthStateChanged(auth, async (user) => {
      $('loading').style.display = 'none';
      if (user) {
        $('login-screen').style.display = 'none';
        $('app').style.display = 'block';
        await loadState(user);
        startListening();
        render();
      } else {
        $('login-screen').style.display = 'flex';
        $('app').style.display = 'none';
        if (unsubscribe) { unsubscribe(); unsubscribe = null; }
      }
    });

    $('signin-btn').onclick = async () => {
      ensureAudio(); // Triggers TTS warmup early
      const email = $('email').value.trim();
      const password = $('password').value;
      const errEl = $('login-error');
      errEl.textContent = '';
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (e) {
        errEl.textContent = e.code === 'auth/invalid-credential' ? 'Wrong email or password.' : (e.message || 'Sign in failed.');
      }
    };
    $('password').onkeydown = (e) => { if (e.key === 'Enter') $('signin-btn').click(); };

    // Online/offline indicator
    function setConn() {
      isOnline = navigator.onLine;
      $('conn-status').classList.toggle('offline', !isOnline);
    }
    window.addEventListener('online', setConn);
    window.addEventListener('offline', setConn);
    setConn();

    // Service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(console.warn);
      });
    }
  </script>
</body>
</html>
