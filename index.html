              <p style="font-size:14px;font-weight:500;margin:2px 0 0">${(familyDocSize / 1024).toFixed(1)} KB</p>
            </div>
            <div style="padding:10px;background:var(--bg-primary);border-radius:var(--radius-md);border:0.5px solid var(--border)">
              <p style="font-size:11px;color:var(--text-secondary);margin:0;text-transform:uppercase;letter-spacing:0.5px">Chores</p>
              <p style="font-size:14px;font-weight:500;margin:2px 0 0">${totalChores}</p>
            </div>
            <div style="padding:10px;background:var(--bg-primary);border-radius:var(--radius-md);border:0.5px solid var(--border)">
              <p style="font-size:11px;color:var(--text-secondary);margin:0;text-transform:uppercase;letter-spacing:0.5px">Pending</p>
              <p style="font-size:14px;font-weight:500;margin:2px 0 0">${totalApprovals}</p>
            </div>
            <div style="padding:10px;background:var(--bg-primary);border-radius:var(--radius-md);border:0.5px solid var(--border)">
              <p style="font-size:11px;color:var(--text-secondary);margin:0;text-transform:uppercase;letter-spacing:0.5px">Total cash</p>
              <p style="font-size:14px;font-weight:500;margin:2px 0 0">${fmt(totalCash)}</p>
            </div>
          </div>

          <p style="font-size:12px;font-weight:500;margin:0 0 6px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px">Destructive actions</p>
          <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:16px">
            <button class="dev-action-btn" data-action="nuke-history" style="text-align:left;padding:10px 12px;border:0.5px solid var(--border);background:var(--bg-primary);border-radius:var(--radius-md);font-size:13px">
              <strong>🗑️ Reset chore history</strong> — clear all ticks, keep chores, jars and bonus history. Useful for testing the weekly cycle.
            </button>
            <button class="dev-action-btn" data-action="nuke-money" style="text-align:left;padding:10px 12px;border:0.5px solid var(--border);background:var(--bg-primary);border-radius:var(--radius-md);font-size:13px">
              <strong>💸 Reset all jars to $0</strong> — clear spend/save/give for both kids, plus all transaction history. Chores untouched.
            </button>
            <button class="dev-action-btn" data-action="nuke-bonus" style="text-align:left;padding:10px 12px;border:0.5px solid var(--border);background:var(--bg-primary);border-radius:var(--radius-md);font-size:13px">
              <strong>✨ Clear bonus history</strong> — wipe all awarded bonuses for both kids. Useful for testing values reset.
            </button>
            <button class="dev-action-btn" data-action="nuke-pending" style="text-align:left;padding:10px 12px;border:0.5px solid var(--border);background:var(--bg-primary);border-radius:var(--radius-md);font-size:13px">
              <strong>⏳ Clear pending approvals</strong> — drop the queue. No money flow happens.
            </button>
            <button class="dev-action-btn" data-action="full-reset" style="text-align:left;padding:10px 12px;border:1px solid var(--danger-text);background:#FFE0E0;border-radius:var(--radius-md);font-size:13px;color:var(--danger-text)">
              <strong>💥 NUCLEAR: reset everything to defaults</strong> — wipes EVERYTHING including kids, chores, jars, values, mottos, PIN. Starts fresh.
            </button>
          </div>

          <p style="font-size:12px;font-weight:500;margin:0 0 6px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px">Test data</p>
          <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:16px">
            <button class="dev-action-btn" data-action="seed-week" style="text-align:left;padding:10px 12px;border:0.5px solid var(--border);background:var(--bg-primary);border-radius:var(--radius-md);font-size:13px">
              <strong>🎲 Seed a week of ticks</strong> — auto-mark each kid as having done ~80% of their chores this week. Approvals auto-applied.

            <button class="dev-action-btn" data-action="seed-bonuses" style="text-align:left;padding:10px 12px;border:0.5px solid var(--border);background:var(--bg-primary);border-radius:var(--radius-md);font-size:13px">
              <strong>🌟 Seed 5 test bonuses</strong> — random value bonuses to both kids across the last 30 days.
            </button>
          </div>

          <p style="font-size:12px;font-weight:500;margin:0 0 6px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px">Backup / restore</p>

            <button id="dev-export-btn" style="text-align:left;padding:10px 12px;border:0.5px solid var(--border);background:var(--bg-primary);border-radius:var(--radius-md);font-size:13px">
              <strong>📤 Export full state as JSON</strong> — downloads a backup file you can keep safe.
            </button>
            <button id="dev-import-btn" style="text-align:left;padding:10px 12px;border:0.5px solid var(--border);background:var(--bg-primary);border-radius:var(--radius-md);font-size:13px">
              <strong>📥 Import state from JSON</strong> — restore from a previous backup. Replaces all current data.
            </button>
          </div>

          <details style="margin-top:12px">
            <summary style="font-size:12px;color:var(--text-secondary);cursor:pointer">Show raw state (read-only)</summary>
            <pre style="font-size:10px;background:var(--bg-secondary);padding:10px;border-radius:var(--radius-md);overflow:auto;max-height:300px;margin-top:8px">${JSON.stringify(state, null, 2).replace(/</g, '&lt;')}</pre>
          </details>
        </div>
      `;
    }

    function openDevConfirmModal(actionLabel, dangerWord, onConfirm) {
      $('modal-root').innerHTML = `
        <div class="modal-backdrop" id="dev-confirm-backdrop">

    function runDevAction(action) {
      const labels = {
        'nuke-history': ['Reset chore history', 'RESET'],
        'nuke-money': ['Reset all jars to $0', 'NUKE'],
        'nuke-bonus': ['Clear bonus history', 'CLEAR'],
        'nuke-pending': ['Clear pending approvals', 'CLEAR'],
        'full-reset': ['NUCLEAR reset', 'NUKE'],
      };
      const [label, word] = labels[action];
      openDevConfirmModal(label, word, () => {
        if (action === 'nuke-history') {
          Object.values(state.kids).forEach(k => {
            (k.chores || []).forEach(c => {
              c.history = c.schedule.map(s => s ? 'available' : 'na');
              c.streak = 0;
            });
          });
        } else if (action === 'nuke-money') {
          Object.values(state.kids).forEach(k => {
            k.spend = 0; k.save = 0; k.give = 0;
            k.spendHistory = []; k.saveHistory = []; k.giveHistory = [];
          });
        } else if (action === 'nuke-bonus') {
          Object.values(state.kids).forEach(k => { k.bonusHistory = []; });
        } else if (action === 'nuke-pending') {
          state.pendingApprovals = [];
          Object.values(state.kids).forEach(k => {
            (k.chores || []).forEach(c => {
              c.history = c.history.map(h => h === 'pending' ? 'available' : h);
            });
          });
        } else if (action === 'full-reset') {
          // Wipe everything except photoURLs (storage handles those separately)
          const photos = {};
          Object.entries(state.kids).forEach(([id, k]) => { if (k.photoURL) photos[id] = k.photoURL; });
          state = JSON.parse(JSON.stringify(DEFAULT_STATE));
          // Re-apply photos so we don't lose them
          Object.entries(photos).forEach(([id, url]) => {
            if (state.kids[id]) state.kids[id].photoURL = url;
          });
        }
        scheduleSave();
        render();
      });
    }

    function seedTestData(kind) {
      const tIdx = todayIdx();
      const today = new Date().toISOString().slice(0,10);
      if (kind === 'week') {
        Object.values(state.kids).forEach(k => {
          (k.chores || []).forEach(c => {
            c.history = c.schedule.map((s, i) => {
              if (!s) return 'na';
              if (i > tIdx) return 'available';
              // ~80% done rate
              if (Math.random() < 0.8) {
                // For paid chores, add money + mark done
                if (c.paid) {
                  k.spend = (k.spend || 0) + c.amount * 0.7;
                  k.save = (k.save || 0) + c.amount * 0.2;
                  k.give = (k.give || 0) + c.amount * 0.1;
                  if (!k.saveHistory) k.saveHistory = [];
                  k.saveHistory.push({ date: today, amount: c.amount * 0.2, type: 'in', note: c.title });
                  if (!k.giveHistory) k.giveHistory = [];
                  k.giveHistory.push({ date: today, amount: c.amount * 0.1, type: 'in', note: c.title });
                }
                return 'done';
              }
              return 'missed';
            });
            // Recompute streak
            let s = 0;
            for (let i = tIdx; i >= 0; i--) {
              if (c.history[i] === 'done') s++;
              else if (c.history[i] === 'na') continue;
              else break;
            }
            c.streak = s;
          });
        });
      } else if (kind === 'bonuses') {
        const values = state.familyValues || [];
        const reasons = [
          'Helped without being asked',
          'Stayed calm during a tough moment',
          'Shared with their brother',
          'Tried something new and hard',
          'Told the truth even though it was hard'
        ];
        Object.entries(state.kids).forEach(([kidId, k]) => {
          for (let i = 0; i < 5; i++) {
            const v = values[Math.floor(Math.random() * values.length)];
            const r = reasons[Math.floor(Math.random() * reasons.length)];
            const amt = [1, 2, 2, 3][Math.floor(Math.random() * 4)];
            const daysAgo = Math.floor(Math.random() * 30);
            const d = new Date(); d.setDate(d.getDate() - daysAgo);
            const dateISO = d.toISOString().slice(0, 10);
            k.spend = (k.spend || 0) + amt * 0.7;
            k.save = (k.save || 0) + amt * 0.2;
            k.give = (k.give || 0) + amt * 0.1;
            if (!k.bonusHistory) k.bonusHistory = [];
            k.bonusHistory.push({
              date: dateISO,
              amount: amt,
              reason: r,
              value: v ? v.name : null,
              emoji: v ? v.emoji : null,
              unviewed: false
            });
          }
        });
      }
      scheduleSave();
      render();
    }

    function exportStateAsJSON() {
      const dataStr = JSON.stringify(state, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const ts = new Date().toISOString().slice(0, 19).replace(/:/g, '-');
      a.href = url;
      a.download = `family-cfo-backup-${ts}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function importStateFromJSON() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const imported = JSON.parse(reader.result);
            if (!imported.kids) {
              alert('Invalid backup file — missing kids data.');
              return;
            }
            openDevConfirmModal('Import & replace all data', 'IMPORT', () => {
              state = imported;
              scheduleSave();
              render();
              alert('Data imported. App will refresh.');
            });
          } catch (err) {
            alert('Could not parse JSON: ' + err.message);
          }
        };
        reader.readAsText(file);
      };
      input.click();
    }

              ${VALUE_EMOJI_PALETTE.map(em => `<button type="button" class="emoji-pick" data-emoji="${em}" style="width:100%;aspect-ratio:1;border:0.5px solid var(--border);background:var(--bg-primary);border-radius:var(--radius-md);font-size:22px;padding:0">${em}</button>`).join('')}
            </div>
            <div class="modal-actions">
              <button class="cancel" id="m-emoji-cancel">Cancel</button>
            </div>
          </div>
        </div>
      `;

      $('modal-root').innerHTML = `
        <div class="modal-backdrop" id="values-modal-backdrop">
          <div class="modal">
            <h2>Values & mottos</h2>
            <h3 style="font-size:13px;font-weight:500;margin:14px 0 8px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px">Family values</h3>
            <p style="font-size:12px;color:var(--text-secondary);margin:0 0 10px">Define what your family stands for. Tap the emoji to change it.</p>
            <div id="values-list-wrap">${renderList()}</div>
            <div style="display:flex;gap:6px;margin-top:8px">
              <input type="text" id="m-value-new" maxlength="20" placeholder="Add a value (e.g. Resilience)" style="flex:1;padding:8px;border:0.5px solid var(--border);border-radius:var(--radius-md);font-size:13px">
              <button type="button" id="m-value-add" style="background:#0F6E56;color:white;border:none;padding:8px 14px;border-radius:var(--radius-md);font-size:13px;font-weight:500">Add</button>
            </div>

            <h3 style="font-size:13px;font-weight:500;margin:20px 0 8px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px">Family mottos</h3>
            <p style="font-size:12px;color:var(--text-secondary);margin:0 0 10px">Short, memorable phrases. One is shown on the picker each day, cycling daily.</p>
            <div id="mottos-list-wrap">${renderMottosList()}</div>
            <div style="display:flex;gap:6px;margin-top:8px">
              <input type="text" id="m-motto-new" maxlength="60" placeholder="Add a motto (e.g. Work hard, play hard)" style="flex:1;padding:8px;border:0.5px solid var(--border);border-radius:var(--radius-md);font-size:13px">
              <button type="button" id="m-motto-add" style="background:#0F6E56;color:white;border:none;padding:8px 14px;border-radius:var(--radius-md);font-size:13px;font-weight:500">Add</button>
            </div>
            <div class="modal-actions">
              <button class="cancel" id="m-values-cancel">Cancel</button>
              <button class="save" id="m-values-save">Save</button>
            </div>
          </div>
        </div>
      `;
      $('values-modal-backdrop').onclick = (e) => { if (e.target.id === 'values-modal-backdrop') closeModal(); };
      $('m-values-cancel').onclick = closeModal;

      const refreshList = () => {
        $('values-list-wrap').innerHTML = renderList();
        document.querySelectorAll('.value-remove-btn').forEach(b => {
          b.onclick = () => {
            values.splice(parseInt(b.dataset.idx), 1);
            refreshList();
          };
        });
        document.querySelectorAll('.value-emoji-btn').forEach(b => {
          b.onclick = () => {
            const idx = parseInt(b.dataset.idx);
            const overlay = document.createElement('div');
            overlay.innerHTML = renderEmojiPicker(idx);
            $('modal-root').appendChild(overlay.firstElementChild);
            $('emoji-picker-backdrop').onclick = (e) => {
              if (e.target.id === 'emoji-picker-backdrop') {
                $('emoji-picker-backdrop').remove();
              }
            };
            $('m-emoji-cancel').onclick = () => $('emoji-picker-backdrop').remove();
            document.querySelectorAll('.emoji-pick').forEach(eb => {
              eb.onclick = () => {
                values[idx].emoji = eb.dataset.emoji;
                $('emoji-picker-backdrop').remove();
                refreshList();
              };
            });
          };
        });
      };
      refreshList();

      const refreshMottos = () => {
        $('mottos-list-wrap').innerHTML = renderMottosList();
        document.querySelectorAll('.motto-remove-btn').forEach(b => {
          b.onclick = () => {
            mottos.splice(parseInt(b.dataset.idx), 1);
            refreshMottos();
          };
        });
      };
      refreshMottos();

      $('m-value-add').onclick = () => {
        const name = ($('m-value-new').value || '').trim();
        if (!name) return;
        if (values.length >= 10) return alert('Limit 10 values.');
        if (values.some(x => x.name.toLowerCase() === name.toLowerCase())) return alert('Already in the list.');
        values.push({ name, emoji: suggestEmoji(name) });
        $('m-value-new').value = '';
        refreshList();
      };

      $('m-motto-add').onclick = () => {
        const m = ($('m-motto-new').value || '').trim();
        if (!m) return;
        if (mottos.length >= 10) return alert('Limit 10 mottos.');
        if (mottos.some(x => x.toLowerCase() === m.toLowerCase())) return alert('Already in the list.');
        mottos.push(m);
        $('m-motto-new').value = '';
        refreshMottos();
      };

      $('m-values-save').onclick = () => {
        state.familyValues = values;
        state.familyMottos = mottos;
        scheduleSave();
        closeModal();
        render();
      };
    }

    function renderChoreManagement() {
      return `
        <div class="card">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">

            <button id="add-chore-btn" style="border:0.5px solid var(--border);background:var(--bg-primary);padding:6px 12px;border-radius:var(--radius-md);font-size:12px"><i class="ti ti-plus" style="font-size:13px;vertical-align:-1px"></i> Add chore</button>
          </div>

          ${Object.entries(state.kids).map(([kid, k]) => {
            const hasPhoto = !!k.photoURL;
            const mgmtAvatarStyle = hasPhoto
              ? `background-image:url('${k.photoURL}');background-size:cover;background-position:center`
              : `background:${k.textColor};color:white`;
            const chores = k.chores || [];
            return `
            <div style="margin-top:12px;padding:10px;background:var(--bg-secondary);border-radius:var(--radius-md)">
              <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
                <div style="width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:14px;${mgmtAvatarStyle}">${hasPhoto ? '' : k.avatar}</div>
                <div style="flex:1">
                  <p style="font-size:13px;font-weight:500;margin:0">${k.name}</p>
                  <p style="font-size:11px;margin:2px 0 0;color:var(--text-secondary)">Age ${k.age} · ${k.mode}</p>
                </div>
                <button class="edit-kid-btn" data-kid="${kid}" style="border:0.5px solid var(--border);background:var(--bg-primary);padding:6px 10px;border-radius:var(--radius-md);font-size:12px"><i class="ti ti-edit" style="font-size:12px;vertical-align:-1px"></i> Edit ${k.name}</button>
              </div>
              ${chores.map((c, idx) => `
                <div class="chore-mgmt-row">
                  <div class="reorder-btns">
                    <button class="reorder-btn move-chore-up" data-kid="${kid}" data-chore-id="${c.id}" ${idx === 0 ? 'disabled' : ''} aria-label="Move up"><i class="ti ti-chevron-up" style="font-size:12px"></i></button>
                    <button class="reorder-btn move-chore-down" data-kid="${kid}" data-chore-id="${c.id}" ${idx === chores.length - 1 ? 'disabled' : ''} aria-label="Move down"><i class="ti ti-chevron-down" style="font-size:12px"></i></button>
                  </div>
                  <i class="ti ${c.icon}" style="font-size:18px;color:${k.textColor}"></i>
                  <div style="flex:1;min-width:0">
                    <p style="font-size:13px;margin:0;font-weight:500">${c.title}${c.hardWork ? ' 💪' : ''}${c.schoolReady ? ' 🎒' : ''}</p>
                    <p style="font-size:11px;margin:2px 0 0;color:var(--text-secondary)">${fmt(c.amount)} · ${c.schedule.filter(Boolean).length} days/wk</p>
                  </div>
                  <button class="edit-chore-btn" data-kid="${kid}" data-chore-id="${c.id}" aria-label="Edit"><i class="ti ti-edit" style="font-size:16px"></i></button>
                  <button class="delete-chore-btn" data-kid="${kid}" data-chore-id="${c.id}" style="border:none;background:transparent;color:var(--danger-text);padding:4px"><i class="ti ti-trash" style="font-size:16px"></i></button>
                </div>
              `).join('')}
              ${chores.length === 0 ? `<p style="font-size:12px;color:var(--text-secondary);padding:8px 0;margin:0">No chores yet — tap "Add chore" above.</p>` : ''}
            </div>
          `;}).join('')}
        </div>
      `;
    }

    // ---------- Modals ----------
    function closeModal() {
      $('modal-root').innerHTML = '';
    }

    function openChoreModal(mode, kidId, choreId) {
      // mode: 'add' | 'edit'
      const isEdit = mode === 'edit';
      let chore;
      if (isEdit) {
        chore = state.kids[kidId].chores.find(c => c.id === choreId);
        if (!chore) return;
      } else {
        chore = { title: '', amount: 0, icon: 'ti-circle-check',
          schedule: [true,true,true,true,true,true,true],
          schoolReady: false, hardWork: false, paid: false, category: 'routines' };
      }
      // Compute weekly target + currently allocated for this kid
      const targetKidForCalc = state.kids[kidId];
      const weeklyTarget = targetKidForCalc.age;
      const currentlyAllocated = (targetKidForCalc.chores || [])
        .filter(c => c.paid && c.id !== (isEdit ? choreId : null))
        .reduce((sum, c) => sum + (c.amount * c.schedule.filter(Boolean).length), 0);

      const kidsOpts = Object.entries(state.kids).map(([id, k]) =>
        `<option value="${id}" ${id === kidId ? 'selected' : ''}>${k.name}</option>`).join('');
      const dayBtns = DAYS.map((d, i) =>
        `<button type="button" class="day-toggle modal-day ${chore.schedule[i] ? 'active' : ''}" data-day="${i}">${d}</button>`).join('');
      const iconBtns = ICON_PALETTE.map(ic =>
        `<button type="button" class="icon-pick-btn modal-icon ${ic === chore.icon ? 'selected' : ''}" data-icon="${ic}"><i class="ti ${ic}" style="font-size:18px"></i></button>`).join('');

      $('modal-root').innerHTML = `
        <div class="modal-backdrop" id="chore-modal-backdrop">
          <div class="modal" id="chore-modal">
            <h2>${isEdit ? 'Edit chore' : 'Add chore'}</h2>
            <div class="form-row">
              <label>For which kid?</label>
              <select id="m-chore-kid" ${isEdit ? 'disabled' : ''}>${kidsOpts}</select>
            </div>
            <div class="form-row">
              <label>Chore name</label>
              <input type="text" id="m-chore-title" maxlength="40" value="${chore.title.replace(/"/g, '&quot;')}" placeholder="e.g. Wash the car">
            </div>
            <div class="form-row">
              <label>Type</label>
              <div class="flag-toggle">
                <button type="button" id="m-type-routine" class="${!chore.paid ? 'active' : ''}">🌟 Routine (unpaid)</button>
                <button type="button" id="m-type-extra" class="${chore.paid ? 'active' : ''}">💼 Paid job</button>
              </div>
              <p style="font-size:11px;color:var(--text-secondary);margin:6px 0 0">Barefoot: routines (brush teeth, make bed) are unpaid — they're being part of the family. Paid jobs are extras (wash car, weeding).</p>
            </div>
            <div class="form-row" id="m-amount-row" style="display:${chore.paid ? 'block' : 'none'}">
              <label>Amount per day done ($)</label>
              <input type="number" id="m-chore-amount" min="0" max="20" step="0.5" value="${chore.amount || 0.5}">
              <p style="font-size:11px;color:var(--text-secondary);margin:6px 0 0">💡 ${targetKidForCalc.name}'s weekly target is ${fmt(weeklyTarget)} (age formula). Already allocated ${fmt(currentlyAllocated)} across other paid jobs.</p>
            </div>
            <div class="form-row">
              <label>Days assigned</label>
              <div class="day-toggles">${dayBtns}</div>
            </div>
            <div class="form-row">
              <label>Tags</label>
              <div class="flag-toggle">
                <button type="button" id="m-flag-school" class="${chore.schoolReady ? 'active' : ''}">🎒 School ready</button>
                <button type="button" id="m-flag-hard" class="${chore.hardWork ? 'active' : ''}">💪 Hard work</button>
              </div>
            </div>
            <div class="form-row">
              <label>Icon</label>
              <div class="icon-picker">${iconBtns}</div>
            </div>
            <div class="modal-actions">
              <button class="cancel" id="m-chore-cancel">Cancel</button>
              <button class="save" id="m-chore-save">${isEdit ? 'Save changes' : 'Add chore'}</button>
            </div>
          </div>
        </div>
      `;

      // Wire handlers
      $('chore-modal-backdrop').onclick = (e) => {
        if (e.target.id === 'chore-modal-backdrop') closeModal();
      };
      $('m-chore-cancel').onclick = closeModal;

      let pickedIcon = chore.icon;
      document.querySelectorAll('.modal-icon').forEach(b => {
        b.onclick = () => {
          document.querySelectorAll('.modal-icon').forEach(x => x.classList.remove('selected'));
          b.classList.add('selected');
          pickedIcon = b.dataset.icon;
        };
      });
      document.querySelectorAll('.modal-day').forEach(b => {
        b.onclick = () => b.classList.toggle('active');
      });
      let flagSchool = chore.schoolReady || false;
      let flagHard = chore.hardWork || false;
      let isPaid = chore.paid || false;
      $('m-flag-school').onclick = () => { flagSchool = !flagSchool; $('m-flag-school').classList.toggle('active', flagSchool); };
      $('m-flag-hard').onclick   = () => { flagHard   = !flagHard;   $('m-flag-hard').classList.toggle('active', flagHard); };
      $('m-type-routine').onclick = () => {
        isPaid = false;
        $('m-type-routine').classList.add('active');
        $('m-type-extra').classList.remove('active');
        $('m-amount-row').style.display = 'none';
      };
      $('m-type-extra').onclick = () => {
        isPaid = true;
        $('m-type-extra').classList.add('active');
        $('m-type-routine').classList.remove('active');
        $('m-amount-row').style.display = 'block';
      };

      $('m-chore-save').onclick = () => {
        const title = $('m-chore-title').value.trim();
        const amount = isPaid ? (parseFloat($('m-chore-amount').value) || 0) : 0;
        if (!title) return alert('Please enter a chore name');
        const days = Array.from(document.querySelectorAll('.modal-day')).map(b => b.classList.contains('active'));
        const targetKidId = isEdit ? kidId : $('m-chore-kid').value;

        if (isEdit) {
          // Mutate in place; preserve history & streak
          const c = state.kids[targetKidId].chores.find(x => x.id === choreId);
          if (!c) return;
          c.title = title;
          c.amount = amount;
          c.paid = isPaid;
          c.category = isPaid ? 'extras' : 'routines';
          c.icon = pickedIcon;
          c.schoolReady = flagSchool;
          c.hardWork = flagHard;
          c.schedule = days;
          c.history = c.history.map((h, i) => {
            if (!days[i]) return 'na';
            return h === 'na' ? 'available' : h;
          });
        } else {
          const newChore = {
            id: 'c' + Date.now(),
            title, icon: pickedIcon, amount,
            paid: isPaid,
            category: isPaid ? 'extras' : 'routines',
            schoolReady: flagSchool, hardWork: flagHard,
            schedule: days,
            history: days.map(d => d ? 'available' : 'na'),
            streak: 0
          };
          if (!state.kids[targetKidId].chores) state.kids[targetKidId].chores = [];
          state.kids[targetKidId].chores.push(newChore);
        }
        scheduleSave();
        closeModal();
        render();
      };
    }

    function openKidModal(kidId) {
      const k = state.kids[kidId];
      const hasPhoto = !!k.photoURL;
      const previewStyle = hasPhoto
        ? `background-image:url('${k.photoURL}')`
        : `background:${k.bgColor};color:${k.textColor}`;
      const modes = [
        { id: 'learning', label: 'Learning' },
        { id: 'independent', label: 'Independent' },
      ];
      $('modal-root').innerHTML = `
        <div class="modal-backdrop" id="kid-modal-backdrop">
          <div class="modal" id="kid-modal">
            <h2>Edit ${k.name}</h2>
            <div class="form-row">
              <label>Name</label>
              <input type="text" id="m-kid-name" maxlength="20" value="${k.name.replace(/"/g, '&quot;')}">
            </div>
            <div class="form-row">
              <label>Age</label>
              <input type="number" id="m-kid-age" min="2" max="18" value="${k.age}">
            </div>
            <div class="form-row">
              <label>Mode</label>
              <div class="mode-toggle">
                ${modes.map(m => `<button type="button" class="mode-toggle-btn ${k.mode === m.id ? 'active' : ''}" data-mode="${m.id}">${m.label}</button>`).join('')}
              </div>
              <p style="font-size:11px;color:var(--text-secondary);margin:6px 0 0">Currently a labelling field only — tap-target sizing is set separately below.</p>
            </div>
            <div class="form-row">
              <label>Tap-target size</label>
              <div class="mode-toggle">
                <button type="button" class="mode-toggle-btn tap-size-btn ${(k.tapSize || 'standard') === 'standard' ? 'active' : ''}" data-size="standard">Standard</button>
                <button type="button" class="mode-toggle-btn tap-size-btn ${k.tapSize === 'big' ? 'active' : ''}" data-size="big">Big</button>
                <button type="button" class="mode-toggle-btn tap-size-btn ${k.tapSize === 'extra-big' ? 'active' : ''}" data-size="extra-big">XL</button>
                <button type="button" class="mode-toggle-btn tap-size-btn ${k.tapSize === 'huge' ? 'active' : ''}" data-size="huge">Huge</button>
              </div>
              <p style="font-size:11px;color:var(--text-secondary);margin:6px 0 0">Bigger tap targets help young fingers.</p>
            </div>
            <div class="form-row">
              <label>Photo</label>
              <div class="photo-upload-wrap">
                <div class="photo-preview" id="m-photo-preview" style="${previewStyle}">${hasPhoto ? '' : k.avatar}</div>
                <div style="display:flex;flex-direction:column;gap:6px">
                  <label class="photo-upload-btn">
                    ${hasPhoto ? 'Change photo' : 'Upload photo'}
                    <input type="file" id="m-photo-input" accept="image/*">
                  </label>
                  ${hasPhoto ? `<button type="button" class="photo-upload-btn removing" id="m-photo-remove">Remove</button>` : ''}
                </div>
              </div>
              <p style="font-size:11px;color:var(--text-secondary);margin:6px 0 0">Photo is auto-cropped square and resized to 256×256.</p>
            </div>
            <div class="form-row">
              <label>Savings goal (Barefoot Ladder) — optional</label>
              <div class="flag-toggle">
                <button type="button" id="m-goal-off" class="${!(k.goal && k.goal.enabled) ? 'active' : ''}">Off</button>
                <button type="button" id="m-goal-on" class="${(k.goal && k.goal.enabled) ? 'active' : ''}">On</button>
              </div>
              <div id="m-goal-fields" style="display:${(k.goal && k.goal.enabled) ? 'block' : 'none'};margin-top:8px">
                <input type="text" id="m-goal-name" maxlength="40" value="${(k.goal && k.goal.name || '').replace(/"/g, '&quot;')}" placeholder="e.g. LEGO Death Star" style="width:100%;padding:8px;border:0.5px solid var(--border);border-radius:var(--radius-md);font-size:13px;margin-bottom:6px">
                <div style="display:flex;gap:6px">
                  <input type="number" id="m-goal-target" min="10" max="2000" step="5" value="${k.goal && k.goal.target || 100}" placeholder="Target $" style="flex:2;padding:8px;border:0.5px solid var(--border);border-radius:var(--radius-md);font-size:13px">
                  <select id="m-goal-match" style="flex:1;padding:8px;border:0.5px solid var(--border);border-radius:var(--radius-md);font-size:13px">
                    <option value="0" ${(k.goal && k.goal.matchRatio) === 0 ? 'selected' : ''}>No match</option>
                    <option value="0.5" ${(k.goal && k.goal.matchRatio) === 0.5 ? 'selected' : ''}>0.5:1 match</option>
                    <option value="1" ${(k.goal && k.goal.matchRatio) === 1 ? 'selected' : ''}>1:1 match</option>
                    <option value="2" ${(k.goal && k.goal.matchRatio) === 2 ? 'selected' : ''}>2:1 match</option>
                  </select>
                </div>
              </div>
              <p style="font-size:11px;color:var(--text-secondary);margin:6px 0 0">When ON, ${k.name} sees a goal bar on their Save jar. Match means: for every $1 they save, parent adds $X when goal hits.</p>
            </div>
            <div class="modal-actions">
              <button class="cancel" id="m-kid-cancel">Cancel</button>
              <button class="save" id="m-kid-save">Save changes</button>
            </div>
          </div>

      `;

      let pickedMode = k.mode;
      let pendingPhotoFile = null;
      let pendingPhotoRemove = false;
      let goalEnabled = !!(k.goal && k.goal.enabled);

      $('kid-modal-backdrop').onclick = (e) => {
        if (e.target.id === 'kid-modal-backdrop') closeModal();
      };
      $('m-kid-cancel').onclick = closeModal;

      // Mode picker — exclude tap-size buttons
      document.querySelectorAll('.mode-toggle-btn[data-mode]').forEach(b => {
        b.onclick = () => {
          document.querySelectorAll('.mode-toggle-btn[data-mode]').forEach(x => x.classList.remove('active'));
          b.classList.add('active');
          pickedMode = b.dataset.mode;
        };
      });

      // Tap-size picker
      let pickedTapSize = k.tapSize || 'standard';
      document.querySelectorAll('.tap-size-btn').forEach(b => {
        b.onclick = () => {
          document.querySelectorAll('.tap-size-btn').forEach(x => x.classList.remove('active'));
          b.classList.add('active');
          pickedTapSize = b.dataset.size;
        };
      });

      $('m-goal-off').onclick = () => {
        goalEnabled = false;
        $('m-goal-off').classList.add('active');
        $('m-goal-on').classList.remove('active');
        $('m-goal-fields').style.display = 'none';
      };
      $('m-goal-on').onclick = () => {
        goalEnabled = true;
        $('m-goal-on').classList.add('active');
        $('m-goal-off').classList.remove('active');
        $('m-goal-fields').style.display = 'block';
      };

      $('m-photo-input').onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const cropped = await openPhotoCropModal(file);
        if (!cropped) return; // user cancelled
        pendingPhotoFile = cropped;
        pendingPhotoRemove = false;
        // Update preview to the cropped result
        const previewUrl = URL.createObjectURL(cropped);
        const prev = $('m-photo-preview');
        if (prev) {
          prev.style.backgroundImage = `url('${previewUrl}')`;
          prev.textContent = '';
          prev.style.background = `url('${previewUrl}') center / cover`;
        }
      };

      const removeBtn = $('m-photo-remove');
      if (removeBtn) {
        removeBtn.onclick = () => {
          pendingPhotoRemove = true;
          pendingPhotoFile = null;
          $('m-photo-preview').style.backgroundImage = 'none';
          $('m-photo-preview').style.background = k.bgColor;
          $('m-photo-preview').style.color = k.textColor;
          $('m-photo-preview').textContent = k.avatar;
          removeBtn.disabled = true;
          removeBtn.textContent = 'Will remove on save';
        };
      }

      $('m-kid-save').onclick = async () => {
        const name = $('m-kid-name').value.trim() || k.name;
        const age = parseInt($('m-kid-age').value) || k.age;
        const saveBtn = $('m-kid-save');
        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving…';
        try {
          state.kids[kidId].name = name;
          state.kids[kidId].age = age;
          state.kids[kidId].mode = pickedMode;
          state.kids[kidId].tapSize = pickedTapSize;
          state.kids[kidId].avatar = name.charAt(0).toUpperCase();
          // Persist goal
          if (goalEnabled) {
            state.kids[kidId].goal = {
              enabled: true,
              name: ($('m-goal-name').value || '').trim() || 'Savings goal',
              target: parseFloat($('m-goal-target').value) || 100,
              matchRatio: parseFloat($('m-goal-match').value) || 0,
            };
          } else {
            state.kids[kidId].goal = { enabled: false, name: '', target: 0, matchRatio: 1 };
          }

          if (pendingPhotoFile) {
            saveBtn.textContent = 'Uploading photo…';
            const url = await uploadKidPhoto(kidId, pendingPhotoFile);
            state.kids[kidId].photoURL = url;
          } else if (pendingPhotoRemove) {
            await deleteKidPhoto(kidId);
            delete state.kids[kidId].photoURL;
          }
          scheduleSave();
          closeModal();
          render();
        } catch (e) {
          console.error('Save failed:', e);
          alert('Save failed: ' + (e.message || e.code || 'unknown error'));
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save changes';
        }
      };
    }

    function generateManagerNote(tIdx) {
      const insights = [];
      Object.entries(state.kids).forEach(([id, k]) => {
        // Streaks
        const longStreaks = (k.chores || []).filter(c => (c.streak || 0) >= 3);
        if (longStreaks.length) {
          const top = longStreaks.sort((a,b) => (b.streak||0) - (a.streak||0))[0];
          insights.push(`${k.name} on a ${top.streak}-day streak with ${top.title.toLowerCase()} — call it out`);
        }
        // Repeat misses
        (k.chores || []).forEach(c => {
          const missedThisWeek = c.history.slice(0, tIdx).filter((h,i) => c.schedule[i] && h === 'missed').length;
          if (missedThisWeek >= 2) {
            insights.push(`${k.name} skipped "${c.title}" ${missedThisWeek}× this week — worth a chat`);
          }
        });
      });
      if (!insights.length) return "Nothing flagged this week. Keep an eye on streaks as they build.";
      return insights.slice(0, 2).join('. ') + '.';
    }

    // ---------- Burst animation ----------
    function showBurst(x, y, color) {
      const el = document.createElement('div');
      el.className = 'burst';
      el.style.cssText = `position:fixed;left:${x}px;top:${y}px;width:32px;height:32px;background:${color};border-radius:50%;z-index:998`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 600);
    }

    // ---------- Handlers ----------
    function attachHandlers() {
      document.querySelectorAll('.nav-btn').forEach(b => {
        b.onclick = () => {
          ensureAudio();
          const targetView = b.dataset.view;
          if (targetView === 'parent' && !parentUnlocked) {
            if (!state.parentPin) {
              openPinSetupModal();
            } else {
              openPinEntryModal();
            }
            return;
          }
          if (targetView === 'dev' && !devTabUnlocked) return; // shouldn't be possible to click but guard anyway
          view = targetView;
          activeKid = null;
          render();
        };
      });

      // Dev tab handlers
      document.querySelectorAll('.dev-action-btn').forEach(b => {
        b.onclick = () => {
          const action = b.dataset.action;
          if (action === 'seed-week') {
            seedTestData('week');
          } else if (action === 'seed-bonuses') {
            seedTestData('bonuses');
          } else {
            runDevAction(action);
          }
        };
      });
      const exp = $('dev-export-btn');
      if (exp) exp.onclick = exportStateAsJSON;
      const imp = $('dev-import-btn');
      if (imp) imp.onclick = importStateFromJSON;

      const cpBtn = $('change-pin-btn');
      if (cpBtn) cpBtn.onclick = () => openChangePinModal();
      document.querySelectorAll('.kid-tile').forEach(b => {
        b.onclick = () => {
          ensureAudio();
          activeKid = b.dataset.kid;
          view = 'kid';
          render();
        };
      });
      const back = $('back-btn');
      if (back) back.onclick = () => { view = 'picker'; activeKid = null; render(); };

      document.querySelectorAll('.day-cell.tickable').forEach(cell => {
        cell.onclick = () => {
          const choreId = cell.dataset.chore;
          const dIdx = parseInt(cell.dataset.day);
          const kid = state.kids[activeKid];
          const chore = kid.chores.find(c => c.id === choreId);
          if (!chore) return;
          const cur = chore.history[dIdx];

          // Untap pending — kid corrects accidental tap
          if (cur === 'pending') {
            chore.history[dIdx] = 'available';
            // Remove matching pending approval
            const apIdx = state.pendingApprovals.findIndex(p =>
              p.kid === activeKid && p.choreId === choreId && p.dayIdx === dIdx
            );
            if (apIdx >= 0) state.pendingApprovals.splice(apIdx, 1);
            scheduleSave();
            render();
            return;
          }

          if (cur !== 'available') return;

          // Unpaid (routine) — auto-complete, no approval, no money
          if (!chore.paid) {
            chore.history[dIdx] = 'done';
            let streak = 0;
            for (let i = dIdx; i >= 0; i--) {
              if (chore.history[i] === 'done') streak++;
              else if (chore.history[i] === 'na') continue;
              else break;
            }
            chore.streak = streak;
            playMarioCoin();
            const r = cell.getBoundingClientRect();
            showBurst(r.left + r.width/2, r.top + r.height/2, kid.accentColor);
            scheduleSave();
            render();
            return;
          }

          // Paid — go to pending for parent approval
          chore.history[dIdx] = 'pending';
          state.pendingApprovals.push({
            kid: activeKid, chore: chore.title, amount: chore.amount,
            time: dIdx === todayIdx() ? 'just now' : 'yesterday',
            dayIdx: dIdx, choreId, hardWork: chore.hardWork || false
          });
          playMarioCoin();
          const r = cell.getBoundingClientRect();
          showBurst(r.left + r.width/2, r.top + r.height/2, kid.accentColor);
          scheduleSave();
          render();
        };
      });

      document.querySelectorAll('.approve-btn').forEach(b => {
        b.onclick = () => {
          const idx = parseInt(b.dataset.idx);
          const p = state.pendingApprovals[idx];
          const kid = state.kids[p.kid];
          const chore = kid.chores.find(c => c.id === p.choreId);
          if (chore) {
            chore.history[p.dayIdx] = 'done';
            let streak = 0;
            for (let i = p.dayIdx; i >= 0; i--) {
              if (chore.history[i] === 'done') streak++;
              else if (chore.history[i] === 'na') continue;
              else break;
            }
            chore.streak = streak;
          }
          // 70/20/10 split + log to histories
          const today = new Date().toISOString().slice(0,10);
          const spendAmt = p.amount * 0.7;
          const saveAmt  = p.amount * 0.2;
          const giveAmt  = p.amount * 0.1;
          kid.spend = (kid.spend || 0) + spendAmt;
          kid.save  = (kid.save  || 0) + saveAmt;
          kid.give  = (kid.give  || 0) + giveAmt;
          if (!kid.saveHistory) kid.saveHistory = [];
          kid.saveHistory.push({ date: today, amount: saveAmt, type: 'in', note: p.chore });
          if (!kid.giveHistory) kid.giveHistory = [];
          kid.giveHistory.push({ date: today, amount: giveAmt, type: 'in', note: p.chore });
          state.pendingApprovals.splice(idx, 1);
          playApprovalChime();
          scheduleSave();
          render();
        };
      });
      document.querySelectorAll('.reject-btn').forEach(b => {
        b.onclick = () => {
          const idx = parseInt(b.dataset.idx);
          const p = state.pendingApprovals[idx];
          const kid = state.kids[p.kid];
          const chore = kid.chores.find(c => c.id === p.choreId);
          if (chore) chore.history[p.dayIdx] = 'available';
          state.pendingApprovals.splice(idx, 1);
          scheduleSave();
          render();
        };
      });

      // Sound + signout
      const sb = $('sound-toggle');
      if (sb) sb.onclick = () => {
        soundOn = !soundOn;
        if (soundOn) ensureAudio();
        sb.querySelector('i').className = soundOn ? 'ti ti-volume' : 'ti ti-volume-off';
      };
      const so = $('signout-btn');
      if (so) so.onclick = () => signOut(auth);

      // Chore management
      const addBtn = $('add-chore-btn');
      if (addBtn) addBtn.onclick = () => {
        // Default to first kid for "add" mode
        const firstKid = Object.keys(state.kids)[0];
        openChoreModal('add', firstKid);
      };

      document.querySelectorAll('.edit-chore-btn').forEach(b => {
        b.onclick = () => openChoreModal('edit', b.dataset.kid, b.dataset.choreId);
      });

      document.querySelectorAll('.edit-kid-btn').forEach(b => {
        b.onclick = () => openKidModal(b.dataset.kid);
      });

      document.querySelectorAll('.move-chore-up').forEach(b => {
        b.onclick = () => {
          const kid = b.dataset.kid;
          const cid = b.dataset.choreId;
          const arr = state.kids[kid].chores;
          const idx = arr.findIndex(c => c.id === cid);
          if (idx > 0) {
            [arr[idx-1], arr[idx]] = [arr[idx], arr[idx-1]];
            scheduleSave();
            render();
          }
        };
      });
      document.querySelectorAll('.move-chore-down').forEach(b => {
        b.onclick = () => {
          const kid = b.dataset.kid;
          const cid = b.dataset.choreId;
          const arr = state.kids[kid].chores;
          const idx = arr.findIndex(c => c.id === cid);
          if (idx >= 0 && idx < arr.length - 1) {
            [arr[idx+1], arr[idx]] = [arr[idx], arr[idx+1]];
            scheduleSave();
            render();
          }
        };
      });

      document.querySelectorAll('.delete-chore-btn').forEach(b => {
        b.onclick = () => {
          if (!confirm('Delete this chore?')) return;
          const kid = b.dataset.kid;
          const cid = b.dataset.choreId;
          state.kids[kid].chores = (state.kids[kid].chores || []).filter(c => c.id !== cid);
          scheduleSave();
          render();
        };
      });

      // Save transfer action
      document.querySelectorAll('.save-transfer-btn').forEach(b => {
        b.onclick = () => openSaveTransferModal(b.dataset.kid);
      });

      // Quarterly Give action
      const giveBtn = $('give-quarterly-btn');
      if (giveBtn) giveBtn.onclick = () => openGiveModal();

      // Spend jar tap-through (kid view)
      const spendJar = $('spend-jar-action');
      if (spendJar) spendJar.onclick = () => openSpendModal(activeKid);

      // Bonus button (per kid on dashboard)
      document.querySelectorAll('.bonus-btn').forEach(b => {
        b.onclick = () => openBonusModal(b.dataset.kid);
      });

      // View kid's view from dashboard
      document.querySelectorAll('.kid-detail-btn').forEach(b => {
        b.onclick = () => {
          activeKid = b.dataset.kid;
          view = 'kid';
          render();
        };
      });

      // Edit family values
      const editValues = $('edit-values-btn');
      if (editValues) editValues.onclick = () => openValuesEditModal();
    }

    // ---------- Save transfer modal ----------
    function openSaveTransferModal(kidId) {
      const k = state.kids[kidId];
      $('modal-root').innerHTML = `
        <div class="modal-backdrop" id="save-modal-backdrop">
          <div class="modal">
            <h2>Transfer ${k.name}'s savings</h2>
            <p style="font-size:13px;color:var(--text-secondary);margin:0 0 12px">
              Move ${fmt(k.save)} from this app's Save jar to ${k.name}'s real high-interest bank account (e.g. ING, UBank, ME Bank).
            </p>
            <div class="form-row">
              <label>Amount to transfer ($)</label>
              <input type="number" id="m-save-amt" min="0" max="${k.save}" step="1" value="${Math.floor(k.save)}">
            </div>
            <div class="form-row">
              <label>Note (optional)</label>
              <input type="text" id="m-save-note" maxlength="40" placeholder="e.g. ING Orange Everyday">
            </div>
            <p style="font-size:12px;color:var(--text-secondary);margin:0 0 12px;line-height:1.4">
              <i class="ti ti-info-circle" style="font-size:13px;vertical-align:-1px"></i> 
              This logs the transfer in app history. <strong>You still need to do the actual bank transfer manually.</strong>
            </p>
            <div class="modal-actions">
              <button class="cancel" id="m-save-cancel">Cancel</button>
              <button class="save" id="m-save-confirm">I've transferred it</button>
            </div>
          </div>
        </div>
      `;
      $('save-modal-backdrop').onclick = (e) => { if (e.target.id === 'save-modal-backdrop') closeModal(); };
      $('m-save-cancel').onclick = closeModal;
      $('m-save-confirm').onclick = () => {
        const amt = parseFloat($('m-save-amt').value) || 0;
        const note = ($('m-save-note').value || 'Bank transfer').trim();
        if (amt <= 0 || amt > k.save) return alert('Enter a valid amount.');
        const today = new Date().toISOString().slice(0,10);
        k.save = Math.max(0, k.save - amt);
        if (!k.saveHistory) k.saveHistory = [];
        k.saveHistory.push({ date: today, amount: amt, type: 'out', note });
        scheduleSave();
        closeModal();
        render();
      };
    }

    // ---------- Quarterly Give modal ----------
    function openGiveModal() {
      const kidsArr = Object.entries(state.kids);
      $('modal-root').innerHTML = `
        <div class="modal-backdrop" id="give-modal-backdrop">
          <div class="modal">
            <h2>Time to give 🎁</h2>
            <p style="font-size:13px;color:var(--text-secondary);margin:0 0 12px">
              Pick a charity together with the boys. They learn most when they choose, and ideally hand over the money in person.
            </p>
            <div class="form-row">
              <label>Charity / cause</label>
              <input type="text" id="m-give-charity" maxlength="60" placeholder="e.g. The Smith Family, RSPCA, local food bank">
            </div>
            ${kidsArr.map(([id, k]) => `
              <div style="padding:10px;background:var(--bg-secondary);border-radius:var(--radius-md);margin-bottom:6px">
                <div style="display:flex;align-items:center;justify-content:space-between">
                  <p style="font-size:13px;font-weight:500;margin:0">${k.name}'s Give jar</p>
                  <p style="font-size:13px;margin:0;color:#993556;font-weight:500">${fmt(k.give || 0)}</p>
                </div>
                <label style="display:flex;align-items:center;gap:8px;font-size:12px;margin-top:6px">
                  <input type="checkbox" class="m-give-check" data-kid="${id}" ${(k.give || 0) > 0 ? 'checked' : 'disabled'}>
                  Give all of ${k.name}'s ${fmt(k.give || 0)}
                </label>
              </div>
            `).join('')}
            <div class="modal-actions">
              <button class="cancel" id="m-give-cancel">Skip for now</button>
              <button class="save" id="m-give-confirm">Mark donated</button>
            </div>
          </div>
        </div>
      `;
      $('give-modal-backdrop').onclick = (e) => { if (e.target.id === 'give-modal-backdrop') closeModal(); };
      $('m-give-cancel').onclick = closeModal;
      $('m-give-confirm').onclick = () => {
        const charity = ($('m-give-charity').value || '').trim();
        if (!charity) return alert('Please enter the charity or cause.');
        const today = new Date().toISOString().slice(0,10);
        document.querySelectorAll('.m-give-check').forEach(cb => {
          if (!cb.checked) return;
          const kid = state.kids[cb.dataset.kid];
          const amt = kid.give || 0;
          if (amt <= 0) return;
          kid.give = 0;
          if (!kid.giveHistory) kid.giveHistory = [];
          kid.giveHistory.push({ date: today, amount: amt, type: 'out', note: charity });
        });
        state.lastGiveQuarter = getCurrentQuarter();
        scheduleSave();
        closeModal();
        render();
      };
    }

    // ---------- Spend jar modal (kid records what they bought) ----------
    function openSpendModal(kidId) {
      const k = state.kids[kidId];
      $('modal-root').innerHTML = `
        <div class="modal-backdrop" id="spend-modal-backdrop">
          <div class="modal">
            <h2>${k.name}'s Spend jar</h2>
            <p style="font-size:13px;color:var(--text-secondary);margin:0 0 12px">
              Available: <strong style="color:#185FA5">${fmt(k.spend || 0)}</strong>
            </p>
            <div class="form-row">
              <label>What did you buy?</label>
              <input type="text" id="m-spend-item" maxlength="40" placeholder="e.g. Pokemon cards">
            </div>
            <div class="form-row">
              <label>How much did it cost ($)</label>
              <input type="number" id="m-spend-amt" min="0" max="${k.spend || 0}" step="0.5" value="${Math.min(5, k.spend || 0)}">
            </div>
            <div class="modal-actions">
              <button class="cancel" id="m-spend-cancel">Cancel</button>
              <button class="save" id="m-spend-confirm">Record purchase</button>
            </div>
          </div>
        </div>
      `;
      $('spend-modal-backdrop').onclick = (e) => { if (e.target.id === 'spend-modal-backdrop') closeModal(); };
      $('m-spend-cancel').onclick = closeModal;
      $('m-spend-confirm').onclick = () => {
        const item = ($('m-spend-item').value || '').trim();
        const amt = parseFloat($('m-spend-amt').value) || 0;
        if (!item) return alert('What did you buy?');
        if (amt <= 0 || amt > (k.spend || 0)) return alert('Check the amount.');
        const today = new Date().toISOString().slice(0,10);
        k.spend = Math.max(0, (k.spend || 0) - amt);
        if (!k.spendHistory) k.spendHistory = [];
        k.spendHistory.push({ date: today, amount: amt, type: 'out', note: item });
        scheduleSave();
        closeModal();
        render();
      };
    }

    // ---------- Auth flow ----------
    onAuthStateChanged(auth, async (user) => {
      $('loading').style.display = 'none';
      // Always reset session locks when auth changes
      parentUnlocked = false;
      devTabUnlocked = false;
      if (user) {
        $('login-screen').style.display = 'none';
        $('app').style.display = 'block';
        $('version-footer').style.display = 'block';
        await loadState(user);
        startListening();
        render();
      } else {
        $('login-screen').style.display = 'flex';
        $('app').style.display = 'none';
        $('version-footer').style.display = 'none';
        if (unsubscribe) { unsubscribe(); unsubscribe = null; }
      }
    });

    $('signin-btn').onclick = async () => {
      ensureAudio(); // Triggers TTS warmup early
      const email = $('email').value.trim();
      const password = $('password').value;
      const errEl = $('login-error');
      errEl.textContent = '';
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (e) {
        errEl.textContent = e.code === 'auth/invalid-credential' ? 'Wrong email or password.' : (e.message || 'Sign in failed.');
      }
    };
    $('password').onkeydown = (e) => { if (e.key === 'Enter') $('signin-btn').click(); };

    // Online/offline indicator
    function setConn() {
      isOnline = navigator.onLine;
      $('conn-status').classList.toggle('offline', !isOnline);
    }
    window.addEventListener('online', setConn);
    window.addEventListener('offline', setConn);
    setConn();

    // Service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(console.warn);
      });
    }

    // Easter egg: tap version footer 7 times within 4 seconds to reveal Dev tab
    (function setupDevUnlock() {
      const f = $('version-footer');
      if (!f) return;
      let taps = 0;
      let timer = null;
      f.addEventListener('click', () => {
        taps++;
        clearTimeout(timer);
        timer = setTimeout(() => { taps = 0; }, 4000);
        if (taps >= 7) {
          taps = 0;
          // Require PIN unlock first
          if (!parentUnlocked) {
            alert('Unlock Parent CFO first, then tap 7 times again to reveal Dev tab.');
            return;
          }
          devTabUnlocked = true;
          alert('Dev tab unlocked for this session.');
          render();
        }
      });
    })();
  </script>
</body>
</html>
